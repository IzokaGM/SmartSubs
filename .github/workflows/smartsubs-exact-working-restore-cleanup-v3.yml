          SMARTSUBS_ARCHIVE

          base64 --decode "$ARCHIVE_B64" > "$ARCHIVE_GZ"

          EXPECTED="22700e2000fda4ea07b45fdf916a017373586ebb5749aeb550657b550c95d67c"
          ACTUAL="$(sha256sum "$ARCHIVE_GZ" | awk '{print $1}')"
          echo "Archive SHA-256: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: archive checksum mismatch"
            exit 1
          fi

          echo "2/4 Removing current runtime files..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ARCHIVE_B64" \
            ! -name "$ARCHIVE_GZ" \
            -exec rm -rf {} +

          echo "3/4 Extracting known-working runtime..."
          tar -xzf "$ARCHIVE_GZ" -C .

          rm -f "$ARCHIVE_B64" "$ARCHIVE_GZ"

          echo "4/4 Runtime restore complete."

      - name: Verify exact working build
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR

          echo "Checking required files..."
          for FILE in \
            package.json \
            wrangler.jsonc \
            src/cloudflare-worker.mjs \
            src/diagnostics.js \
            src/translator.js \
            src/manifest.js \
            test/nuvio-worker.test.js \
            test/nuvio-diagnose.test.js
          do
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          node - <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const worker = fs.readFileSync("src/cloudflare-worker.mjs", "utf8");
          const manifest = fs.readFileSync("src/manifest.js", "utf8");
          const wrangler = fs.readFileSync("wrangler.jsonc", "utf8");

          const checks = [
            ["package version 1.0.0", pkg.version === "1.0.0"],
            ["final-stable-m20r3", worker.includes("final-stable-m20r3")],
            ["msa Nuvio path", worker.includes("item.lang === 'msa'")],
            ["manifest 1.0.0", manifest.includes("version: '1.0.0'")],
            ["KV binding", wrangler.includes('"SMARTSUBS_CACHE"')],
            ["Queue binding", wrangler.includes('"SMARTSUBS_TRANSLATION_QUEUE"')]
          ];

          let failed = false;
          for (const [name, ok] of checks) {
            console.log(`${ok ? "OK" : "FAIL"}: ${name}`);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE

          if [ -f src/index.js ]; then
            echo "FAIL: M21 src/index.js still exists"
            exit 1
          fi

          echo "Exact working build verified."

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          npm install --no-package-lock --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          npm run check

      - name: Run all 67 tests
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR

          npm test 2>&1 | tee .smartsubs-tests.log

          PASS="$(grep -E '^# pass ' .smartsubs-tests.log | tail -1 | awk '{print $3}')"
          FAIL="$(grep -E '^# fail ' .smartsubs-tests.log | tail -1 | awk '{print $3}')"

          echo "Detected pass=$PASS fail=$FAIL"

          rm -f .smartsubs-tests.log

          if [ "$PASS" != "67" ] || [ "$FAIL" != "0" ]; then
            echo "ERROR: expected 67 pass and 0 fail"
            exit 1
          fi

      - name: Wrangler dry run
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR
          npx wrangler deploy --dry-run --outdir .cf-build

      - name: Clean old workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR

          echo "Old workflow files:"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true

          rm -rf .github/workflows
          mkdir -p .github/workflows

          echo '' | base64 --decode > .github/workflows/smartsubs-ci.yml

          echo "Workflow files after cleanup:"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort

          COUNT="$(find .github/workflows -maxdepth 1 -type f | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one workflow after cleanup"
            exit 1
          fi

      - name: Commit restored build
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "FAILED at line $LINENO: $BASH_COMMAND"' ERR

          rm -rf .cf-build node_modules
          rm -f package-lock.json .smartsubs-tests.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "Changes being committed:"
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No changes needed. Repository already matches working build."
            exit 0
          fi

          git commit -m "restore: exact known-working SmartSubs build and clean workflows [skip ci]"
          git push origin HEAD:main

          git fetch origin main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"

          echo "local=$LOCAL"
          echo "remote=$REMOTE"

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: push verification failed"
            exit 1
          fi

      - name: Remove old Actions run history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Cleanup warning at line $LINENO: $BASH_COMMAND"' ERR

          CURRENT="${{ github.run_id }}"
          REPO="${{ github.repository }}"

          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > .smartsubs-run-ids.txt

          while read -r ID; do
            [ -n "$ID" ] || continue
            [ "$ID" = "$CURRENT" ] && continue
            gh api --method DELETE "repos/$REPO/actions/runs/$ID" >/dev/null 2>&1 || true
          done < .smartsubs-run-ids.txt

          rm -f .smartsubs-run-ids.txt
          echo "Old Actions run cleanup attempted."
