name: SmartSubs Restore Pre-M21 Known Good

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Restore exact pre-M21 runtime
        shell: bash
        run: |
          set -euo pipefail

          GOOD_COMMIT="08dc472a15bcc609b8fa183f7f56c99418b5008d"

          git cat-file -e "${GOOD_COMMIT}^{commit}"

          # Remove current rewritten runtime and tests so no M21-only files survive.
          git rm -r --ignore-unmatch src test

          # Restore the exact runtime/config/test state immediately before M21.
          git restore \
            --source="${GOOD_COMMIT}" \
            --staged \
            --worktree \
            src \
            test \
            package.json \
            package-lock.json \
            wrangler.jsonc \
            README.md

          # Restore START_HERE.md if it existed in the known-good commit.
          if git cat-file -e "${GOOD_COMMIT}:START_HERE.md" 2>/dev/null; then
            git restore \
              --source="${GOOD_COMMIT}" \
              --staged \
              --worktree \
              START_HERE.md
          fi

      - name: Verify exact known-good identity
        shell: bash
        run: |
          set -euo pipefail

          grep -q "final-stable-m20r3" src/cloudflare-worker.mjs
          grep -q "version: '1.0.0'" src/manifest.js
          grep -q "item.lang === 'msa'" src/cloudflare-worker.mjs
          grep -q '"SMARTSUBS_CACHE"' wrangler.jsonc
          grep -q '"SMARTSUBS_TRANSLATION_QUEUE"' wrangler.jsonc

          node - <<'NODE'
          const pkg = require("./package.json");
          if (pkg.version !== "1.0.0") {
            throw new Error(`Expected package version 1.0.0, got ${pkg.version}`);
          }
          NODE

          if [ -f package-lock.json ]; then
            echo "Unexpected package-lock.json in pre-M21 restore."
            exit 1
          fi

          echo "Verified exact pre-M21 final-stable-m20r3 runtime."

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The known-good pre-M21 commit intentionally has no package-lock.json.
          npm install --no-package-lock --no-audit --no-fund

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run check > /tmp/smartsubs-check.log 2>&1; then
            echo "=== Syntax check failed, last 80 lines ==="
            tail -n 80 /tmp/smartsubs-check.log
            exit 1
          fi
          tail -n 20 /tmp/smartsubs-check.log || true

      - name: Full recovered test suite
        shell: bash
        run: |
          set -euo pipefail
          if ! npm test > /tmp/smartsubs-test.log 2>&1; then
            echo "=== Tests failed, last 100 lines ==="
            tail -n 100 /tmp/smartsubs-test.log
            exit 1
          fi
          tail -n 30 /tmp/smartsubs-test.log || true

      - name: Wrangler dry run
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --dry-run --outdir .cf-build > /tmp/smartsubs-wrangler.log 2>&1; then
            echo "=== Wrangler dry run failed, last 100 lines ==="
            tail -n 100 /tmp/smartsubs-wrangler.log
            exit 1
          fi
          tail -n 30 /tmp/smartsubs-wrangler.log || true

      - name: Commit restored runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cf-build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src test package.json package-lock.json wrangler.jsonc README.md START_HERE.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Repository already matches pre-M21 known-good runtime."
            exit 0
          fi

          git commit -m "restore: pre-M21 final-stable-m20r3 runtime [skip ci]"
          git push origin HEAD:main
