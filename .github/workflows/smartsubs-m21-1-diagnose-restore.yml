name: SmartSubs M21.1 Diagnose Restore

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubs-m21-1-diagnose
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify M21 base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path('package.json').read_text())
          index = Path('src/index.js').read_text()
          translator = Path('src/translator.js').read_text()
          wrangler = json.loads(Path('wrangler.jsonc').read_text())
          if pkg.get('version') not in {'2.1.0', '2.1.1'}:
              raise SystemExit(f"Expected M21 version 2.1.0 or 2.1.1, found {pkg.get('version')}")
          required_index = ['m21-context-v1', 'TRANSLATION_JOBS', 'TRANSLATION_QUEUE']
          for marker in required_index:
              if marker not in index:
                  raise SystemExit(f"Current src/index.js is not the expected M21 base: missing {marker}")
          for marker in ['thinkingLevel = "MINIMAL"', 'translateSubtitleText', 'buildChunks']:
              if marker not in translator:
                  raise SystemExit(f"Current src/translator.js is not the expected M21 base: missing {marker}")
          vars_ = wrangler.get('vars', {})
          expected = {
              'TRANSLATION_CONCURRENCY': '3',
              'TRANSLATION_CHUNK_SIZE': '240',
              'TRANSLATION_CONTEXT_OVERLAP': '5',
          }
          for key, value in expected.items():
              if str(vars_.get(key)) != value:
                  raise SystemExit(f"Refusing to change translation profile: {key}={vars_.get(key)!r}, expected {value!r}")
          print('M21 base verified. Translation profile remains 3 x 240 cues with 5 cue context overlap.')
          PY

      - name: Write src/diagnostics.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'src/diagnostics.js')"
          cat > 'src/diagnostics.js' <<'EOF_SRC_DIAGNOSTICS_JS'
          export const DIAG_TTL_MS = 24 * 60 * 60 * 1000;
          export const MAX_EVENTS = 50;
          
          const ALLOWED_FIELDS = new Set([
            "type", "id", "result", "error", "cache", "status", "reason", "profile",
            "upstreamCount", "malayCount", "englishCount", "subtitleCount", "englishFound",
            "autoReady", "totalMs", "openSubtitlesMs", "malayScore", "englishScore",
            "expected", "received", "missing", "retryRecovered", "fallbackCount", "final",
            "semanticRetriesUsed", "retries", "chunks", "geminiCalls", "rateLimits",
            "transientRetries", "retryWaitMs", "chunkItems", "chunkChars", "concurrency",
            "attempts", "waitMs", "polls", "joinStatus", "queueDelayMs", "sourceFetchMs",
            "parseMs", "sourceBytes", "cueCount", "pipelineMs", "translationWallMs",
            "chunkTimeline", "maxChunkMs", "avgChunkMs", "sumChunkMs", "geminiCallMs",
            "geminiStatuses", "geminiPromptChars", "failureStage", "retryDelaySeconds",
            "nextAttempt"
          ]);
          
          export function safeText(value, max = 180) {
            return String(value == null ? "" : value)
              .replace(/[\u0000-\u001f\u007f]/g, " ")
              .slice(0, max);
          }
          
          export function sanitiseEvent(event = {}) {
            const output = {
              ts: Number.isFinite(Number(event.ts)) ? Number(event.ts) : Date.now(),
              event: safeText(event.event, 48),
            };
            for (const key of ALLOWED_FIELDS) {
              const value = event[key];
              if (value === undefined) continue;
              if (typeof value === "boolean" || typeof value === "number") output[key] = value;
              else if (Array.isArray(value)) output[key] = value.slice(0, 12).map((item) => safeText(item, 48));
              else output[key] = safeText(value);
            }
            return output;
          }
          
          export function pruneEvents(events = [], now = Date.now(), limit = MAX_EVENTS) {
            const cutoff = Number(now) - DIAG_TTL_MS;
            return events
              .map((event) => sanitiseEvent(event))
              .filter((event) => event.ts >= cutoff)
              .sort((a, b) => b.ts - a.ts)
              .slice(0, Math.max(1, Math.min(MAX_EVENTS, Number(limit) || MAX_EVENTS)));
          }
          
          export function deriveVerdict(events = []) {
            const rows = pruneEvents(events);
            const lastSubtitle = rows.find((item) => item.event === "subtitle-result");
            const afterSubtitle = (name, predicate = () => true) => rows.find((item) =>
              item.event === name && predicate(item) && (!lastSubtitle || Number(item.ts) >= Number(lastSubtitle.ts))
            );
            if (!lastSubtitle) return "NO_SUBTITLE_REQUEST_SEEN";
            if (lastSubtitle.result === "native-malay") return "NATIVE_MALAY_RETURNED";
            if (lastSubtitle.result === "error") return "SUBTITLE_REQUEST_FAILED";
            if (Number(lastSubtitle.subtitleCount || 0) === 0) {
              if (lastSubtitle.englishFound === false) return "NO_ENGLISH_SOURCE_FOUND";
              return "SUBTITLE_REQUEST_RETURNED_ZERO";
            }
            if (afterSubtitle("translation-delivered")) return "TRANSLATION_DELIVERED";
            if (afterSubtitle("translation-failed")) return "TRANSLATION_FAILED";
            if (afterSubtitle("queue-join-start")) return "QUEUE_JOIN_WAITING";
            if (afterSubtitle("translation-request", (item) => item.status !== "prefetch")) return "TRANSLATION_REQUESTED_WAITING_FOR_RESULT";
            if (afterSubtitle("queue-translation-complete")) return "QUEUE_PREFETCH_READY_WAITING_FOR_PLAYER_SELECTION";
            if (afterSubtitle("queue-translation-failed")) return "QUEUE_PREFETCH_FAILED_WAITING_FOR_PLAYER_SELECTION";
            if (afterSubtitle("queue-translation-start")) return "QUEUE_PREFETCH_TRANSLATING";
            if (afterSubtitle("queue-enqueued")) return "QUEUE_PREFETCH_QUEUED";
            if (lastSubtitle.autoReady) return "SUBTITLE_RETURNED_WAITING_FOR_PLAYER_SELECTION";
            return "SUBTITLE_RETURNED";
          }
          
          function esc(value) {
            return safeText(value, 1000)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\"/g, "&quot;")
              .replace(/'/g, "&#39;");
          }
          
          function metricRows(events) {
            const row = pruneEvents(events).find((item) =>
              ["queue-translation-complete", "translation-delivered", "queue-translation-failed", "translation-failed"].includes(item.event)
            );
            if (!row) return '<div class="muted">No translation performance data yet.</div>';
            const keys = [
              "cache", "totalMs", "queueDelayMs", "sourceFetchMs", "parseMs", "translationWallMs",
              "cueCount", "chunks", "geminiCalls", "geminiCallMs", "geminiPromptChars", "retries",
              "retryRecovered", "maxChunkMs", "avgChunkMs", "concurrency", "failureStage"
            ];
            const cards = keys.filter((key) => row[key] !== undefined).map((key) =>
              `<div class="metric"><span>${esc(key)}</span><strong>${esc(row[key])}</strong></div>`
            ).join("");
            const timeline = Array.isArray(row.chunkTimeline) && row.chunkTimeline.length
              ? `<div class="timeline"><b>chunkTimeline</b><br>${row.chunkTimeline.map(esc).join(" | ")}</div>`
              : "";
            return `<div class="metrics">${cards}</div>${timeline}`;
          }
          
          export function renderRootDiagnosePage(buildId, version) {
            return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartSubs Diagnose</title><style>:root{color-scheme:dark}body{margin:0;background:#101116;color:#f4f4f5;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#181a21;border:1px solid #30333d;border-radius:16px;padding:20px}code{word-break:break-all;color:#c9ffdc}</style></head><body><main class="wrap"><section class="card"><h1>SmartSubs Diagnose</h1><p>Version: <code>${esc(version)}</code> | Build: <code>${esc(buildId)}</code></p><p>Open diagnose through your configured SmartSubs URL:</p><code>https://.../c/YOUR_CONFIG_TOKEN/diagnose</code><p>The configured token is required so each installation sees only its own diagnostic stream.</p></section></main></body></html>`;
          }
          
          export function renderConfiguredDiagnosePage(configId, events, buildId, version) {
            const clean = pruneEvents(events);
            const verdict = deriveVerdict(clean);
            const rows = clean.map((item) => {
              const time = item.ts > 0 ? new Date(item.ts).toISOString() : "unknown";
              const detail = Object.entries(item)
                .filter(([key]) => !["ts", "event"].includes(key))
                .map(([key, value]) => `${esc(key)}=${esc(Array.isArray(value) ? value.join(",") : value)}`)
                .join(" | ");
              return `<tr><td>${esc(time)}</td><td>${esc(item.event)}</td><td>${detail}</td></tr>`;
            }).join("") || '<tr><td colspan="3">No request events recorded in the last 24 hours.</td></tr>';
          
            return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartSubs Diagnose</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101116;color:#f4f4f5;font-family:system-ui,sans-serif}.wrap{max-width:1040px;margin:auto;padding:24px 14px}.card{background:#181a21;border:1px solid #30333d;border-radius:16px;padding:18px;margin-bottom:14px}.verdict{font-size:20px;font-weight:800;color:#c9ffdc;word-break:break-word}.muted{color:#aeb1bb;font-size:13px}.codes{display:grid;gap:6px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{background:#111319;border:1px solid #2a2d36;border-radius:10px;padding:10px}.metric span{display:block;color:#aeb1bb;font-size:11px}.metric strong{display:block;margin-top:4px;color:#c9ffdc;word-break:break-word}.timeline{margin-top:10px;font-size:12px;word-break:break-word}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid #30333d;word-break:break-word}th{color:#c7c9d1}code{color:#c9ffdc}</style></head><body><main class="wrap"><section class="card"><h1>SmartSubs Diagnose</h1><div class="verdict">${esc(verdict)}</div><p class="muted">Version ${esc(version)} | Build ${esc(buildId)} | Config ${esc(configId)} | Events kept for up to 24 hours.</p></section><section class="card"><h2>Latest performance</h2>${metricRows(clean)}</section><section class="card"><div class="codes"><div><code>NO_SUBTITLE_REQUEST_SEEN</code>: the configured addon has not been asked for subtitles yet.</div><div><code>NATIVE_MALAY_RETURNED</code>: a strong native Malay match was selected.</div><div><code>NO_ENGLISH_SOURCE_FOUND</code>: no recognised English source was available for Malay Auto.</div><div><code>SUBTITLE_RETURNED_WAITING_FOR_PLAYER_SELECTION</code>: Malay Auto was returned and background work has not reported a later state yet.</div><div><code>QUEUE_PREFETCH_QUEUED</code>: translation is queued before player selection.</div><div><code>QUEUE_PREFETCH_TRANSLATING</code>: the Queue consumer is translating now.</div><div><code>QUEUE_PREFETCH_READY_WAITING_FOR_PLAYER_SELECTION</code>: Malay Auto finished before player selection.</div><div><code>QUEUE_PREFETCH_FAILED_WAITING_FOR_PLAYER_SELECTION</code>: background translation failed and player selection may retry.</div><div><code>QUEUE_JOIN_WAITING</code>: the player selected Malay Auto while the same job was already translating.</div><div><code>TRANSLATION_DELIVERED</code>: translated VTT was returned successfully.</div><div><code>TRANSLATION_FAILED</code>: the player translation request failed.</div></div></section><section class="card"><h2>Recent events</h2><table><thead><tr><th>Time UTC</th><th>Event</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></section></main></body></html>`;
          }
          EOF_SRC_DIAGNOSTICS_JS

      - name: Write src/translator.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'src/translator.js')"
          cat > 'src/translator.js' <<'EOF_SRC_TRANSLATOR_JS'
          import { buildChunks, parseSubtitle, toVtt } from "./subtitles.js";
          const SYSTEM_PROMPT = `You translate English subtitle dialogue into natural conversational Bahasa Melayu for Malaysian viewers.
          Rules:
          1. Preserve meaning, tone, humour, slang, names, speaker labels, HTML/SSA tags and line breaks where practical.
          2. Do not translate proper names unless Malay normally translates them.
          3. Prefer concise spoken Malay that fits subtitle timing. Avoid stiff literal wording.
          4. Context cues marked contextOnly help continuity. Do not output them.
          5. Return ONLY valid JSON: an array of objects {"i":number,"text":string} for requested target indices, exactly once each.`;
          function modelText(payload) {
            const parts = payload?.candidates?.[0]?.content?.parts || [];
            return parts.map((p) => p.text || "").join("").trim();
          }
          
          function parseModelJson(text) {
            const stripped = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
            const value = JSON.parse(stripped);
            if (!Array.isArray(value)) throw new Error("Gemini did not return an array");
            return value;
          }
          async function geminiCall({ apiKey, model, prompt, thinkingLevel = "MINIMAL", onPerf, chunkIndex = 0, attempt = 1 }) {
            const startedAt = Date.now();
            let status = 0;
            try {
              const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-goog-api-key": apiKey,
                },
                body: JSON.stringify({
                  systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                  contents: [{ role: "user", parts: [{ text: prompt }] }],
                  generationConfig: {
                    responseMimeType: "application/json",
                    thinkingConfig: { thinkingLevel },
                  },
                }),
              });
              status = response.status;
              if (!response.ok) throw new Error(`Gemini ${response.status}: ${(await response.text()).slice(0, 300)}`);
              const rows = parseModelJson(modelText(await response.json()));
              onPerf?.({ type: "gemini-call", chunkIndex, attempt, thinkingLevel, status, ok: true, ms: Date.now() - startedAt, promptChars: prompt.length });
              return rows;
            } catch (error) {
              onPerf?.({ type: "gemini-call", chunkIndex, attempt, thinkingLevel, status, ok: false, ms: Date.now() - startedAt, promptChars: prompt.length });
              throw error;
            }
          }
          function chunkPrompt(chunk) {
            const targets = new Set(chunk.targetIndices);
            return JSON.stringify({
              targetIndices: chunk.targetIndices,
              cues: chunk.cues.map((cue) => ({ i: cue.index, contextOnly: !targets.has(cue.index), text: cue.text })),
            });
          }
          async function translateChunk(args, chunk, chunkIndex) {
            const startedAt = Date.now();
            let rows;
            let retryUsed = false;
            try {
              rows = await geminiCall({ ...args, prompt: chunkPrompt(chunk), thinkingLevel: "MINIMAL", chunkIndex, attempt: 1 });
            } catch (firstError) {
              retryUsed = true;
              rows = await geminiCall({ ...args, prompt: chunkPrompt(chunk), thinkingLevel: "LOW", chunkIndex, attempt: 2 });
            }
            const wanted = new Set(chunk.targetIndices);
            const out = new Map();
            for (const row of rows) {
              const i = Number(row?.i);
              if (!wanted.has(i) || typeof row?.text !== "string" || !row.text.trim()) continue;
              out.set(i, row.text.trim());
            }
            if (out.size !== wanted.size) throw new Error(`Gemini returned ${out.size}/${wanted.size} translated cues`);
            args.onPerf?.({ type: "chunk-complete", chunkIndex, ms: Date.now() - startedAt, cueCount: wanted.size, retryUsed });
            return out;
          }
          export async function translateSubtitleText(text, { apiKey, model = "gemini-3.5-flash-lite", concurrency = 3, chunkSize = 110, overlap = 5, onPerf } = {}) {
            if (!apiKey) throw new Error("GEMINI_API_KEY is not configured");
            const parseStartedAt = Date.now();
            const cues = parseSubtitle(text);
            onPerf?.({ type: "parse-complete", ms: Date.now() - parseStartedAt, cueCount: cues.length });
            if (!cues.length) throw new Error("No subtitle cues were parsed");
            const chunks = buildChunks(cues, chunkSize, overlap);
            const translated = new Map();
            for (let cursor = 0; cursor < chunks.length; cursor += concurrency) {
              const group = chunks.slice(cursor, cursor + concurrency);
              const maps = await Promise.all(group.map((chunk, groupIndex) => translateChunk({ apiKey, model, onPerf }, chunk, cursor + groupIndex)));
              for (const map of maps) for (const [i, value] of map) translated.set(i, value);
            }
          
            const output = cues.map((cue) => ({ ...cue, text: translated.get(cue.index) || cue.text }));
            onPerf?.({ type: "translation-complete", cueCount: cues.length, chunks: chunks.length });
            return toVtt(output);
          }
          export async function fetchSubtitleText(sourceUrl) {
            const response = await fetch(sourceUrl, {
              headers: { "user-agent": "SmartSubs/2.1 (+subtitle translation)" },
              redirect: "follow",
            });
            if (!response.ok) throw new Error(`Subtitle source ${response.status}`);
            const text = await response.text();
            if (!text.trim()) throw new Error("Subtitle source was empty");
            return text;
          }
          EOF_SRC_TRANSLATOR_JS

      - name: Write src/index.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'src/index.js')"
          cat > 'src/index.js' <<'EOF_SRC_INDEX_JS'
          import { DurableObject } from "cloudflare:workers";
          import { configureHtml, openConfig, sealConfig } from "./config.js";
          import { deriveVerdict, MAX_EVENTS, pruneEvents, renderConfiguredDiagnosePage, renderRootDiagnosePage, sanitiseEvent } from "./diagnostics.js";
          import { chooseSubtitlePlan, isEnglish, isMalay } from "./selector.js";
          import { fetchSubtitleText, translateSubtitleText } from "./translator.js";
          import { json, parseExtra, sha256Hex, withCors } from "./utils.js";
          
          const BUILD_ID = "m21.1-diagnose";
          const BASE_MANIFEST = {
            id: "org.smartsubs.malay",
            version: "2.1.1",
            name: "SmartSubs",
            description: "Fast Smart Malay subtitles using OpenSubtitles v3 and Gemini.",
            resources: ["subtitles"],
            types: ["movie", "series"],
            idPrefixes: ["tt"],
            catalogs: [],
          };
          
          function manifest(configured) {
            return {
              ...BASE_MANIFEST,
              behaviorHints: { configurable: true, configurationRequired: !configured },
            };
          }
          function upstreamBase(env) {
            return String(env.OPENSUBTITLES_V3_URL || "https://opensubtitles-v3.strem.io").replace(/\/$/, "");
          }
          async function fetchOpenSubtitles(type, id, extra, env) {
            const suffix = extra && extra !== "*" ? `/${extra}` : "";
            const url = `${upstreamBase(env)}/subtitles/${encodeURIComponent(type)}/${encodeURIComponent(id)}${suffix}.json`;
            const response = await fetch(url, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error(`OpenSubtitles v3 ${response.status}`);
            const data = await response.json();
            return Array.isArray(data?.subtitles) ? data.subtitles : [];
          }
          function stableSourceIdentity(candidate) {
            const url = new URL(candidate.url);
            url.search = "";
            return [candidate.id || "", candidate.lang || "", url.toString()].join("|");
          }
          async function translationKey(candidate, model) {
            return sha256Hex(`${stableSourceIdentity(candidate)}|${model}|m21-context-v1`);
          }
          function routeContext(pathname) {
            const configured = pathname.match(/^\/c\/([A-Za-z0-9_-]+)(\/.*)$/);
            if (configured) return { token: configured[1], path: configured[2], configured: true };
            return { token: null, path: pathname, configured: false };
          }
          async function configFingerprint(token) {
            if (!token) return "";
            return (await sha256Hex(token)).slice(0, 16);
          }
          function scheduleDiagnostic(env, configId, event, executionCtx) {
            if (!configId || !env.DIAGNOSTICS) return;
            const task = env.DIAGNOSTICS.getByName(configId)
              .record({ ...event, ts: Number(event?.ts || Date.now()) })
              .catch(() => false);
            if (executionCtx && typeof executionCtx.waitUntil === "function") executionCtx.waitUntil(task);
            else void task;
          }
          function html(body, status = 200) {
            return new Response(body, {
              status,
              headers: {
                "content-type": "text/html; charset=utf-8",
                "cache-control": "no-store",
                "x-content-type-options": "nosniff",
                "referrer-policy": "no-referrer",
                "x-frame-options": "DENY",
                "content-security-policy": "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'",
              },
            });
          }
          function failureStage(error) {
            const message = String(error?.message || error || "");
            if (/OpenSubtitles|Subtitle source|No subtitle cues|No timed subtitle cues/i.test(message)) return "source";
            if (/Gemini/i.test(message)) return "gemini";
            if (/translated cues|return an array|JSON/i.test(message)) return "validation";
            if (/Durable Object|storage|cache/i.test(message)) return "cache";
            return "unknown";
          }
          function translationPerfCollector() {
            const perf = {
              parseMs: 0,
              cueCount: 0,
              chunks: 0,
              geminiCalls: 0,
              geminiCallMs: 0,
              geminiPromptChars: 0,
              geminiStatuses: [],
              chunkTimeline: [],
              chunkMs: [],
              retries: 0,
              retryRecovered: 0,
              rateLimits: 0,
            };
            const onPerf = (event = {}) => {
              if (event.type === "parse-complete") {
                perf.parseMs = Math.max(0, Math.round(Number(event.ms) || 0));
                perf.cueCount = Math.max(0, Number(event.cueCount) || 0);
              } else if (event.type === "gemini-call") {
                perf.geminiCalls += 1;
                perf.geminiCallMs += Math.max(0, Math.round(Number(event.ms) || 0));
                perf.geminiPromptChars += Math.max(0, Number(event.promptChars) || 0);
                perf.geminiStatuses.push(String(event.status || "error"));
                if (Number(event.status) === 429) perf.rateLimits += 1;
                if (Number(event.attempt) > 1) perf.retries += 1;
              } else if (event.type === "chunk-complete") {
                const ms = Math.max(0, Math.round(Number(event.ms) || 0));
                perf.chunkMs.push(ms);
                perf.chunkTimeline.push(`#${Number(event.chunkIndex) + 1}:${ms}ms/${Number(event.cueCount) || 0}`);
                if (event.retryUsed) perf.retryRecovered += 1;
              } else if (event.type === "translation-complete") {
                perf.cueCount = Math.max(perf.cueCount, Number(event.cueCount) || 0);
                perf.chunks = Math.max(0, Number(event.chunks) || 0);
              }
            };
            const summary = () => {
              const sumChunkMs = perf.chunkMs.reduce((sum, value) => sum + value, 0);
              return {
                ...perf,
                sumChunkMs,
                maxChunkMs: perf.chunkMs.length ? Math.max(...perf.chunkMs) : 0,
                avgChunkMs: perf.chunkMs.length ? Math.round(sumChunkMs / perf.chunkMs.length) : 0,
              };
            };
            return { onPerf, summary };
          }
          
          async function smartSubtitles(request, env, route, executionCtx) {
            const url = new URL(request.url);
            const match = route.path.match(/^\/subtitles\/(movie|series)\/([^/]+)(?:\/(.*))?\.json$/);
            if (!match) return null;
            if (!route.token && !env.GEMINI_API_KEY) throw new Error("Configure SmartSubs first at /configure");
          
            const requestStartedAt = Date.now();
            const [, type, encodedId, rawExtra = ""] = match;
            const id = decodeURIComponent(encodedId);
            const extraString = rawExtra || "";
            const extra = parseExtra(extraString);
            const configId = await configFingerprint(route.token);
            scheduleDiagnostic(env, configId, { event: "subtitle-request", type, id }, executionCtx);
          
            try {
              const config = route.token
                ? await openConfig(route.token, env.CONFIG_SECRET)
                : { apiKey: env.GEMINI_API_KEY, model: env.GEMINI_MODEL || "gemini-3.5-flash-lite" };
              const upstreamStartedAt = Date.now();
              const subtitles = await fetchOpenSubtitles(type, id, extraString, env);
              const openSubtitlesMs = Date.now() - upstreamStartedAt;
              const plan = chooseSubtitlePlan(subtitles, extra);
              const malayCount = subtitles.filter(isMalay).length;
              const englishCount = subtitles.filter(isEnglish).length;
              const result = [];
          
              if (plan.mode === "native" && plan.bestMalay?.item?.url) {
                result.push({ id: `smartsubs-native-${plan.bestMalay.item.id || "ms"}`, url: plan.bestMalay.item.url, lang: "Malay" });
                scheduleDiagnostic(env, configId, {
                  event: "subtitle-result",
                  result: "native-malay",
                  upstreamCount: subtitles.length,
                  malayCount,
                  englishCount,
                  subtitleCount: result.length,
                  englishFound: Boolean(plan.bestEnglish),
                  autoReady: false,
                  malayScore: Number(plan.bestMalay?.score || 0),
                  englishScore: Number(plan.bestEnglish?.score || 0),
                  reason: plan.reason,
                  openSubtitlesMs,
                  totalMs: Date.now() - requestStartedAt,
                }, executionCtx);
              } else if (plan.mode === "translate" && plan.bestEnglish?.item?.url) {
                const source = plan.bestEnglish.item;
                const model = config.model || env.GEMINI_MODEL || "gemini-3.5-flash-lite";
                const key = await translationKey(source, model);
                const prefix = route.token ? `/c/${route.token}` : "";
                result.push({ id: `smartsubs-auto-${key.slice(0, 12)}`, url: `${url.origin}${prefix}/vtt/${key}.vtt`, lang: "Malay Auto" });
                const subtitleResultTs = Date.now();
                scheduleDiagnostic(env, configId, {
                  ts: subtitleResultTs,
                  event: "subtitle-result",
                  result: "malay-auto",
                  upstreamCount: subtitles.length,
                  malayCount,
                  englishCount,
                  subtitleCount: result.length,
                  englishFound: true,
                  autoReady: true,
                  malayScore: Number(plan.bestMalay?.score || 0),
                  englishScore: Number(plan.bestEnglish?.score || 0),
                  reason: plan.reason,
                  openSubtitlesMs,
                  totalMs: subtitleResultTs - requestStartedAt,
                }, executionCtx);
                const job = env.TRANSLATION_JOBS.getByName(key);
                await job.ensure({
                  key,
                  sourceUrl: source.url,
                  model,
                  token: route.token || null,
                  configId,
                  enqueuedAt: Date.now(),
                });
              } else {
                scheduleDiagnostic(env, configId, {
                  event: "subtitle-result",
                  result: "no-source",
                  upstreamCount: subtitles.length,
                  malayCount,
                  englishCount,
                  subtitleCount: 0,
                  englishFound: Boolean(plan.bestEnglish),
                  autoReady: false,
                  reason: plan.reason,
                  openSubtitlesMs,
                  totalMs: Date.now() - requestStartedAt,
                }, executionCtx);
              }
              return json({ subtitles: result }, { headers: { "cache-control": "public, max-age=30", "x-smartsubs-build": BUILD_ID } });
            } catch (error) {
              scheduleDiagnostic(env, configId, {
                event: "subtitle-result",
                result: "error",
                error: String(error?.message || error),
                failureStage: failureStage(error),
                subtitleCount: 0,
                totalMs: Date.now() - requestStartedAt,
              }, executionCtx);
              throw error;
            }
          }
          
          async function translatedVtt(env, route) {
            const match = route.path.match(/^\/vtt\/([a-f0-9]{64})\.vtt$/);
            if (!match) return null;
            const key = match[1];
            const configId = await configFingerprint(route.token);
            const job = env.TRANSLATION_JOBS.getByName(key);
            const vtt = await job.getOrRun(route.token || null, configId);
            return new Response(vtt, {
              headers: {
                "content-type": "text/vtt; charset=utf-8",
                "cache-control": "public, max-age=31536000, immutable",
                "access-control-allow-origin": "*",
                "x-smartsubs-build": BUILD_ID,
              },
            });
          }
          
          export class DiagnosticsStore extends DurableObject {
            async record(event) {
              const current = await this.ctx.storage.get("events");
              const events = pruneEvents([sanitiseEvent(event), ...(Array.isArray(current) ? current : [])]);
              await this.ctx.storage.put("events", events);
              return true;
            }
            async read(limit = MAX_EVENTS) {
              const current = await this.ctx.storage.get("events");
              const events = pruneEvents(Array.isArray(current) ? current : [], Date.now(), limit);
              if (Array.isArray(current) && events.length !== current.length) await this.ctx.storage.put("events", events);
              return events;
            }
            async verdict() {
              return deriveVerdict(await this.read());
            }
          }
          
          export class TranslationJob extends DurableObject {
            constructor(ctx, env) {
              super(ctx, env);
              this.inflight = null;
            }
            async ensure(payload) {
              const cached = await this.ctx.storage.get("vtt");
              if (cached) {
                scheduleDiagnostic(this.env, payload.configId, {
                  event: "queue-translation-complete",
                  cache: "HIT",
                  status: "ready",
                  totalMs: 0,
                }, this.ctx);
                return { status: "ready" };
              }
              await this.ctx.storage.put("payload", payload);
              const status = await this.ctx.storage.get("status");
              if (status !== "queued" && status !== "running") {
                await this.ctx.storage.put("status", "queued");
                await this.env.TRANSLATION_QUEUE.send(payload);
                scheduleDiagnostic(this.env, payload.configId, {
                  event: "queue-enqueued",
                  status: "queued",
                }, this.ctx);
                return { status: "queued" };
              }
              scheduleDiagnostic(this.env, payload.configId, {
                event: "queue-enqueued",
                status: String(status || "queued"),
                reason: "existing-job",
              }, this.ctx);
              return { status: String(status || "queued") };
            }
            async getOrRun(requestToken = null, requestConfigId = "") {
              const startedAt = Date.now();
              scheduleDiagnostic(this.env, requestConfigId, { event: "translation-request", status: "player" }, this.ctx);
              const cached = await this.ctx.storage.get("vtt");
              if (cached) {
                scheduleDiagnostic(this.env, requestConfigId, {
                  event: "translation-delivered",
                  cache: "HIT",
                  status: "ready",
                  totalMs: Date.now() - startedAt,
                  waitMs: 0,
                  joinStatus: "cache-hit",
                }, this.ctx);
                return cached;
              }
              const payload = await this.ctx.storage.get("payload");
              if (!payload) throw new Error("Translation job payload is missing");
              if (requestToken && !payload.token) payload.token = requestToken;
              if (requestConfigId && !payload.configId) payload.configId = requestConfigId;
              const status = await this.ctx.storage.get("status");
              const joining = status === "running" || Boolean(this.inflight);
              if (joining) scheduleDiagnostic(this.env, requestConfigId, { event: "queue-join-start", status: "running" }, this.ctx);
              try {
                const vtt = await this.run(payload, "player");
                scheduleDiagnostic(this.env, requestConfigId, {
                  event: "translation-delivered",
                  cache: joining ? "QUEUE_JOIN" : "MISS",
                  status: "ready",
                  totalMs: Date.now() - startedAt,
                  waitMs: joining ? Date.now() - startedAt : 0,
                  joinStatus: joining ? "queue-join" : "direct",
                }, this.ctx);
                return vtt;
              } catch (error) {
                scheduleDiagnostic(this.env, requestConfigId, {
                  event: "translation-failed",
                  status: "failed",
                  error: String(error?.message || error),
                  failureStage: failureStage(error),
                  totalMs: Date.now() - startedAt,
                }, this.ctx);
                throw error;
              }
            }
            async run(payload, origin = "player") {
              const cached = await this.ctx.storage.get("vtt");
              if (cached) {
                if (origin === "queue") {
                  scheduleDiagnostic(this.env, payload.configId, {
                    event: "queue-translation-complete",
                    cache: "HIT",
                    status: "ready",
                    totalMs: 0,
                  }, this.ctx);
                }
                return cached;
              }
              if (this.inflight) return this.inflight;
              this.inflight = (async () => {
                const pipelineStartedAt = Date.now();
                await this.ctx.storage.put("status", "running");
                if (origin === "queue") {
                  scheduleDiagnostic(this.env, payload.configId, {
                    event: "queue-translation-start",
                    status: "consumer",
                    profile: "m21-context",
                    attempts: Number(payload.attempts || 1),
                    queueDelayMs: payload.enqueuedAt ? Math.max(0, Date.now() - Number(payload.enqueuedAt)) : 0,
                    chunkItems: Number(this.env.TRANSLATION_CHUNK_SIZE || 240),
                    concurrency: Number(this.env.TRANSLATION_CONCURRENCY || 3),
                  }, this.ctx);
                }
                try {
                  const config = payload.token
                    ? await openConfig(payload.token, this.env.CONFIG_SECRET)
                    : { apiKey: this.env.GEMINI_API_KEY, model: payload.model || this.env.GEMINI_MODEL };
                  const sourceStartedAt = Date.now();
                  const sourceText = await fetchSubtitleText(payload.sourceUrl);
                  const sourceFetchMs = Date.now() - sourceStartedAt;
                  const sourceBytes = new TextEncoder().encode(sourceText).byteLength;
                  const collector = translationPerfCollector();
                  const translationStartedAt = Date.now();
                  const vtt = await translateSubtitleText(sourceText, {
                    apiKey: config.apiKey,
                    model: payload.model || config.model || this.env.GEMINI_MODEL || "gemini-3.5-flash-lite",
                    concurrency: Number(this.env.TRANSLATION_CONCURRENCY || 3),
                    chunkSize: Number(this.env.TRANSLATION_CHUNK_SIZE || 240),
                    overlap: Number(this.env.TRANSLATION_CONTEXT_OVERLAP || 5),
                    onPerf: collector.onPerf,
                  });
                  const translationWallMs = Date.now() - translationStartedAt;
                  if (new TextEncoder().encode(vtt).byteLength > 1_900_000) throw new Error("Translated subtitle exceeds Durable Object cache size safety limit");
                  await this.ctx.storage.put({ vtt, status: "ready", readyAt: Date.now() });
                  await this.ctx.storage.delete("payload");
                  const perf = collector.summary();
                  if (origin === "queue") {
                    scheduleDiagnostic(this.env, payload.configId, {
                      event: "queue-translation-complete",
                      cache: "MISS",
                      status: "ready",
                      profile: "m21-context",
                      attempts: Number(payload.attempts || 1),
                      totalMs: Date.now() - pipelineStartedAt,
                      queueDelayMs: payload.enqueuedAt ? Math.max(0, pipelineStartedAt - Number(payload.enqueuedAt)) : 0,
                      sourceFetchMs,
                      sourceBytes,
                      parseMs: perf.parseMs,
                      cueCount: perf.cueCount,
                      expected: perf.cueCount,
                      received: perf.cueCount,
                      missing: 0,
                      chunks: perf.chunks,
                      geminiCalls: perf.geminiCalls,
                      rateLimits: perf.rateLimits,
                      retries: perf.retries,
                      semanticRetriesUsed: perf.retries,
                      transientRetries: perf.retries,
                      retryRecovered: perf.retryRecovered,
                      retryWaitMs: 0,
                      chunkItems: Number(this.env.TRANSLATION_CHUNK_SIZE || 240),
                      concurrency: Number(this.env.TRANSLATION_CONCURRENCY || 3),
                      pipelineMs: Date.now() - pipelineStartedAt,
                      translationWallMs,
                      chunkTimeline: perf.chunkTimeline,
                      maxChunkMs: perf.maxChunkMs,
                      avgChunkMs: perf.avgChunkMs,
                      sumChunkMs: perf.sumChunkMs,
                      geminiCallMs: perf.geminiCallMs,
                      geminiStatuses: perf.geminiStatuses,
                      geminiPromptChars: perf.geminiPromptChars,
                    }, this.ctx);
                  }
                  return vtt;
                } catch (error) {
                  await this.ctx.storage.put({ status: "failed", error: String(error?.message || error).slice(0, 500), failedAt: Date.now() });
                  if (origin === "queue") {
                    scheduleDiagnostic(this.env, payload.configId, {
                      event: "queue-translation-failed",
                      status: "consumer-failed",
                      attempts: Number(payload.attempts || 1),
                      profile: "m21-context",
                      error: String(error?.message || error),
                      failureStage: failureStage(error),
                      totalMs: Date.now() - pipelineStartedAt,
                      queueDelayMs: payload.enqueuedAt ? Math.max(0, pipelineStartedAt - Number(payload.enqueuedAt)) : 0,
                    }, this.ctx);
                  }
                  throw error;
                } finally {
                  this.inflight = null;
                }
              })();
              return this.inflight;
            }
          }
          
          export default {
            async fetch(request, env, executionCtx) {
              try {
                if (request.method === "OPTIONS") return withCors(new Response(null, { status: 204 }));
                const url = new URL(request.url);
                const route = routeContext(url.pathname);
                if (url.pathname === "/") return Response.redirect(`${url.origin}/configure`, 302);
                if (url.pathname === "/configure" && request.method === "GET") return new Response(configureHtml(url.origin), { headers: { "content-type": "text/html; charset=utf-8" } });
                if (url.pathname === "/configure/token" && request.method === "POST") {
                  const body = await request.json();
                  const token = await sealConfig(body, env.CONFIG_SECRET);
                  return json({ manifestUrl: `${url.origin}/c/${token}/manifest.json` });
                }
                if (url.pathname === "/diagnose" && request.method === "GET") return html(renderRootDiagnosePage(BUILD_ID, BASE_MANIFEST.version));
                if (route.configured && route.path === "/diagnose" && request.method === "GET") {
                  await openConfig(route.token, env.CONFIG_SECRET);
                  const configId = await configFingerprint(route.token);
                  const events = env.DIAGNOSTICS ? await env.DIAGNOSTICS.getByName(configId).read(MAX_EVENTS) : [];
                  return html(renderConfiguredDiagnosePage(configId, events, BUILD_ID, BASE_MANIFEST.version));
                }
                if (route.path === "/manifest.json") return json(manifest(route.configured), { headers: { "cache-control": "public, max-age=3600" } });
                const subtitleResponse = await smartSubtitles(request, env, route, executionCtx);
                if (subtitleResponse) return subtitleResponse;
                const vttResponse = await translatedVtt(env, route);
                if (vttResponse) return vttResponse;
                if (route.path === "/health") return json({
                  ok: true,
                  version: BASE_MANIFEST.version,
                  build: BUILD_ID,
                  diagnose: true,
                  queueConfigured: Boolean(env.TRANSLATION_QUEUE),
                  translationJobsConfigured: Boolean(env.TRANSLATION_JOBS),
                  diagnosticsConfigured: Boolean(env.DIAGNOSTICS),
                });
                return json({ error: "not found" }, { status: 404 });
              } catch (error) {
                return json({ error: String(error?.message || error) }, { status: 502 });
              }
            },
            async queue(batch, env, executionCtx) {
              await Promise.all(batch.messages.map(async (message) => {
                const payload = { ...(message.body || {}), attempts: Number(message.attempts || 1) };
                try {
                  const job = env.TRANSLATION_JOBS.getByName(payload.key);
                  await job.run(payload, "queue");
                  message.ack();
                } catch (error) {
                  scheduleDiagnostic(env, payload.configId, {
                    event: "queue-retry-scheduled",
                    status: "retrying",
                    attempts: Number(message.attempts || 1),
                    nextAttempt: Number(message.attempts || 1) + 1,
                    retryDelaySeconds: 5,
                    failureStage: failureStage(error),
                    reason: String(error?.message || error),
                  }, executionCtx);
                  message.retry({ delaySeconds: 5 });
                }
              }));
            },
          };
          EOF_SRC_INDEX_JS

      - name: Write test/diagnostics.test.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'test/diagnostics.test.js')"
          cat > 'test/diagnostics.test.js' <<'EOF_TEST_DIAGNOSTICS_TEST_JS'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { deriveVerdict, pruneEvents, renderConfiguredDiagnosePage, sanitiseEvent } from "../src/diagnostics.js";
          
          test("diagnostics omit tokens and source URLs", () => {
            const row = sanitiseEvent({ event: "queue-enqueued", token: "secret-token", sourceUrl: "https://secret.example/sub.srt", status: "queued" });
            assert.equal(row.status, "queued");
            assert.equal(row.token, undefined);
            assert.equal(row.sourceUrl, undefined);
          });
          
          test("verdict follows queue prefetch lifecycle", () => {
            const base = Date.now();
            const subtitle = { ts: base, event: "subtitle-result", result: "malay-auto", subtitleCount: 1, englishFound: true, autoReady: true };
            assert.equal(deriveVerdict([subtitle, { ts: base + 1, event: "queue-enqueued", status: "queued" }]), "QUEUE_PREFETCH_QUEUED");
            assert.equal(deriveVerdict([subtitle, { ts: base + 2, event: "queue-translation-start", status: "consumer" }]), "QUEUE_PREFETCH_TRANSLATING");
            assert.equal(deriveVerdict([subtitle, { ts: base + 3, event: "queue-translation-complete", status: "ready" }]), "QUEUE_PREFETCH_READY_WAITING_FOR_PLAYER_SELECTION");
            assert.equal(deriveVerdict([subtitle, { ts: base + 4, event: "translation-delivered", status: "ready" }]), "TRANSLATION_DELIVERED");
          });
          
          test("diagnostics keep at most 50 recent events", () => {
            const now = Date.now();
            const events = Array.from({ length: 80 }, (_, i) => ({ ts: now - i, event: "x", totalMs: i }));
            assert.equal(pruneEvents(events).length, 50);
          });
          
          test("diagnose HTML contains performance and verdict without raw token", () => {
            const html = renderConfiguredDiagnosePage("abc123fingerprint", [{ ts: Date.now(), event: "subtitle-result", result: "native-malay", subtitleCount: 1 }], "m21.1-diagnose", "2.1.1");
            assert.match(html, /NATIVE_MALAY_RETURNED/);
            assert.match(html, /Latest performance/);
            assert.doesNotMatch(html, /YOUR_REAL_CONFIG_TOKEN/);
          });
          EOF_TEST_DIAGNOSTICS_TEST_JS

      - name: Update package and Wrangler bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = '2.1.1'
          check = pkg.setdefault('scripts', {}).get('check', '')
          if 'src/diagnostics.js' not in check:
              check = check.rstrip() + ' && node --check src/diagnostics.js'
          pkg['scripts']['check'] = check
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          wrangler_path = Path('wrangler.jsonc')
          wrangler = json.loads(wrangler_path.read_text())
          bindings = wrangler.setdefault('durable_objects', {}).setdefault('bindings', [])
          if not any(item.get('name') == 'DIAGNOSTICS' for item in bindings):
              bindings.append({'name': 'DIAGNOSTICS', 'class_name': 'DiagnosticsStore'})
          migrations = wrangler.setdefault('migrations', [])
          if not any(item.get('tag') == 'v2' for item in migrations):
              migrations.append({'tag': 'v2', 'new_sqlite_classes': ['DiagnosticsStore']})
          wrangler_path.write_text(json.dumps(wrangler, indent=2) + '\n')
          PY

      - name: Guard translation behaviour
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          w = json.loads(Path('wrangler.jsonc').read_text())
          assert w['vars']['TRANSLATION_CONCURRENCY'] == '3'
          assert w['vars']['TRANSLATION_CHUNK_SIZE'] == '240'
          assert w['vars']['TRANSLATION_CONTEXT_OVERLAP'] == '5'
          assert w['vars']['GEMINI_MODEL'] == 'gemini-3.5-flash-lite'
          assert any(x.get('name') == 'TRANSLATION_JOBS' and x.get('class_name') == 'TranslationJob' for x in w['durable_objects']['bindings'])
          assert any(x.get('name') == 'DIAGNOSTICS' and x.get('class_name') == 'DiagnosticsStore' for x in w['durable_objects']['bindings'])
          assert any(x.get('tag') == 'v2' and 'DiagnosticsStore' in x.get('new_sqlite_classes', []) for x in w['migrations'])
          index = Path('src/index.js').read_text()
          assert 'm21-context-v1' in index
          assert 'TRANSLATION_CHUNK_SIZE || 240' in index
          assert 'TRANSLATION_CONCURRENCY || 3' in index
          assert 'TRANSLATION_CONTEXT_OVERLAP || 5' in index
          print('Translation algorithm/profile guard passed.')
          PY

      - name: Reject legacy milestone tests
        shell: bash
        run: |
          set -euo pipefail
          legacy=$(find test -maxdepth 1 -type f \( -name 'm*.test.js' -o -name 'final-stability.test.js' -o -name 'nuvio-*.test.js' \) -print)
          if [ -n "$legacy" ]; then
            echo "Legacy tests unexpectedly present:"
            echo "$legacy"
            exit 1
          fi
          for f in config selector subtitles utils diagnostics; do
            test -f "test/$f.test.js"
          done

      - name: Install development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm run ci

      - name: Wrangler dry run only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cf-build
          npx wrangler deploy --dry-run --outdir .cf-build
          rm -rf .cf-build

      - name: Commit M21.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.js src/translator.js src/diagnostics.js test/diagnostics.test.js package.json wrangler.jsonc
          if git diff --cached --quiet; then
            echo 'M21.1 diagnose is already applied. Nothing to commit.'
            exit 0
          fi
          git commit -m 'Restore SmartSubs M21.1 diagnostics'
          git push origin HEAD:main
