name: Apply SmartSubs Naming Cleanup v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify SmartSubs repository
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d src
          test -f src/cloudflare-worker.mjs

