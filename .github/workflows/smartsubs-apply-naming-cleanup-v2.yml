          base64 --decode /tmp/smartsubs-naming-cleanup.b64 > /tmp/smartsubs-naming-cleanup.tar.gz

          expected="3252b438763e3989bbe2c673970f5bb44dd762877136c7d195b5a94935e2073c"
          actual="$(sha256sum /tmp/smartsubs-naming-cleanup.tar.gz | awk '{print $1}')"

          if [[ "$actual" != "$expected" ]]; then
            echo "Patch checksum mismatch"
            exit 1
          fi

          tar -xzf /tmp/smartsubs-naming-cleanup.tar.gz -C .

      - name: Verify old NuSubs names are gone
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE 'NuSubs|NUSUBS|nusubs' \
            src test docs README.md START_HERE.md package.json wrangler.jsonc; then
            echo "Old NuSubs naming still exists in active project files."
            exit 1
          fi

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md START_HERE.md docs package.json src test wrangler.jsonc
          git commit -m "Standardise project naming as SmartSubs"
          git push origin HEAD:main
