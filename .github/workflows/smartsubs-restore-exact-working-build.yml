name: SmartSubs Restore Exact Working Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-working-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore exact uploaded working runtime
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/smartsubs-working-runtime.b64 <<'SMARTSUBS_ARCHIVE'

SMARTSUBS_ARCHIVE

          base64 --decode /tmp/smartsubs-working-runtime.b64 > /tmp/smartsubs-working-runtime.tar.gz

          EXPECTED_SHA="47273fb42f16ac6db1a1a14aab9243784d4ae17ea2023853c53c7dee569dcd71"
          ACTUAL_SHA="$(sha256sum /tmp/smartsubs-working-runtime.tar.gz | awk '{print $1}')"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: embedded working archive checksum mismatch"
            echo "expected=$EXPECTED_SHA"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

          # Keep .git and .github untouched.
          # Restore every runtime/source/config/test file from the user-provided
          # known-working SmartSubs ZIP.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          tar -xzf /tmp/smartsubs-working-runtime.tar.gz -C .

          echo "Exact uploaded working runtime restored."

      - name: Verify working build identity
        shell: bash
        run: |
          set -euo pipefail

          test -f src/cloudflare-worker.mjs
          test -f src/diagnostics.js
          test -f src/translator.js
          test -f wrangler.jsonc
          test -f package.json
          test ! -f src/index.js
          test ! -f package-lock.json

          grep -q "final-stable-m20r3" src/cloudflare-worker.mjs
          grep -q "version: '1.0.0'" src/manifest.js
          grep -q "item.lang === 'msa'" src/cloudflare-worker.mjs
          grep -q '"SMARTSUBS_CACHE"' wrangler.jsonc
          grep -q '"SMARTSUBS_TRANSLATION_QUEUE"' wrangler.jsonc
          grep -q '"QUEUE_FINAL_CONCURRENCY": "3"' wrangler.jsonc

          node - <<'NODE'
          const pkg = require("./package.json");
          if (pkg.version !== "1.0.0") {
            throw new Error(`Expected exact working package version 1.0.0, got ${pkg.version}`);
          }
          NODE

          echo "Verified final-stable-m20r3 working build."

      - name: Install Wrangler without generating lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run check > /tmp/smartsubs-check.log 2>&1; then
            echo "=== Syntax check failed ==="
            tail -n 80 /tmp/smartsubs-check.log
            exit 1
          fi
          tail -n 20 /tmp/smartsubs-check.log || true

      - name: Run all 67 regression tests
        shell: bash
        run: |
          set -euo pipefail
          if ! npm test > /tmp/smartsubs-test.log 2>&1; then
            echo "=== Regression tests failed ==="
            tail -n 120 /tmp/smartsubs-test.log
            exit 1
          fi

          grep -q "# pass 67" /tmp/smartsubs-test.log
          grep -q "# fail 0" /tmp/smartsubs-test.log

          tail -n 35 /tmp/smartsubs-test.log

      - name: Wrangler dry run
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --dry-run --outdir .cf-build > /tmp/smartsubs-wrangler.log 2>&1; then
            echo "=== Wrangler dry run failed ==="
            tail -n 100 /tmp/smartsubs-wrangler.log
            exit 1
          fi
          tail -n 30 /tmp/smartsubs-wrangler.log || true

      - name: Commit exact working runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cf-build node_modules
          rm -f package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not stage .github. This avoids rewriting workflow files and keeps
          # this action focused on restoring the working SmartSubs runtime.
          git add -A -- . ':(exclude).github'

          if git diff --cached --quiet; then
            echo "Repository runtime already matches the uploaded working build."
            exit 0
          fi

          echo "=== Restore summary ==="
          git diff --cached --stat

          git commit -m "restore: exact known-working SmartSubs runtime [skip ci]"
          git push origin HEAD:main

          git fetch origin main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: push verification failed"
            echo "local=$LOCAL"
            echo "remote=$REMOTE"
            exit 1
          fi

          echo "Exact working runtime pushed to main: $REMOTE"
