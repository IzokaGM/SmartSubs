name: SmartSubs M21.2 Nuvio Compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Patch Nuvio language compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/index.js")
          text = p.read_text(encoding="utf-8")

          native = 'lang: "Malay"'
          auto = 'lang: "Malay Auto"'

          if native not in text:
              raise SystemExit('Expected native Malay lang literal not found')
          if auto not in text:
              raise SystemExit('Expected Malay Auto lang literal not found')

          text = text.replace(native, 'lang: "ms"')
          text = text.replace(auto, 'lang: "ms"')

          if 'const BUILD_ID = "m21.1-diagnose";' not in text:
              raise SystemExit('Expected M21.1 build marker not found')
          if 'version: "2.1.1"' not in text:
              raise SystemExit('Expected M21.1 manifest version not found')

          text = text.replace('const BUILD_ID = "m21.1-diagnose";', 'const BUILD_ID = "m21.2-nuvio-compat";', 1)
          text = text.replace('version: "2.1.1"', 'version: "2.1.2"', 1)

          p.write_text(text, encoding="utf-8")
          PY

          cat > test/nuvio-compat.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const source = fs.readFileSync(new URL("../src/index.js", import.meta.url), "utf8");

          test("SmartSubs returns Malay using Nuvio-compatible ms language code", () => {
            assert.equal(source.includes('lang: "Malay"'), false);
            assert.equal(source.includes('lang: "Malay Auto"'), false);

            const matches = source.match(/lang:\s*"ms"/g) || [];
            assert.ok(matches.length >= 2, "expected native and translated Malay tracks to use ms");
          });

          test("M21 translation profile remains unchanged", () => {
            assert.match(source, /TRANSLATION_CHUNK_SIZE\s*\|\|\s*240/);
            assert.match(source, /TRANSLATION_CONCURRENCY\s*\|\|\s*3/);
            assert.match(source, /m21-context/);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Syntax and project checks
        run: npm run check

      - name: Run full test suite
        run: npm test

      - name: Verify Nuvio compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'lang: "ms"' src/index.js
          ! grep -q 'lang: "Malay"' src/index.js
          ! grep -q 'lang: "Malay Auto"' src/index.js
          grep -q 'm21.2-nuvio-compat' src/index.js
          grep -q 'version: "2.1.2"' src/index.js

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .cf-build

      - name: Commit M21.2 source patch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cf-build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/index.js test/nuvio-compat.test.js

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "fix: restore Nuvio Malay subtitle compatibility [skip ci]"
          git push origin HEAD:main
