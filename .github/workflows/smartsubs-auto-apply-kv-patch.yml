name: SmartSubs - Auto Apply KV Patch

on:
  push:
    branches:
      - main
    paths:
      - SmartSubs_KV_Usage_Tracker_Patch.zip

permissions:
  contents: write

concurrency:
  group: smartsubs-kv-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-test-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout uploaded ZIP
        uses: actions/checkout@v4

      - name: Extract only the expected SmartSubs patch files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path('SmartSubs_KV_Usage_Tracker_Patch.zip')
          if not archive.is_file():
              raise SystemExit(f'ZIP not found at repository root: {archive}')

          # Paths verified against the supplied SmartSubs KV Usage Tracker patch.
          expected = {
              'KV_USAGE_README.md',
              'package.json',
              'wrangler.jsonc',
              'src/cf-cache.mjs',
              'src/cloudflare-worker.mjs',
              'src/kv-usage.mjs',
              'src/subtitles.js',
              'src/token.js',
              'src/translator.js',
              'test/kv-usage.test.js',
              'test/v2-part4-5-malaysian-prompt.test.js',
              'scripts/kv-usage-report.mjs',
          }
          with ZipFile(archive) as z:
              members = z.infolist()
              names = [m.filename for m in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit('Unexpected, duplicate or missing files in patch ZIP; nothing extracted.')
              for member in members:
                  path = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (path.is_absolute() or '..' in path.parts or '\\' in member.filename
                          or member.is_dir() or stat.S_ISLNK(mode)):
                      raise SystemExit(f'Unsafe archive entry: {member.filename}')
              for member in members:
                  target = Path(member.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(member))
                  print(f'Applied: {member.filename}')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Syntax check (must pass before deleting ZIP)
        run: npm run check

      - name: Regression tests (must pass before deleting ZIP)
        run: npm test

      - name: Commit patched files and remove ZIP only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            KV_USAGE_README.md package.json wrangler.jsonc \
            src/cf-cache.mjs src/cloudflare-worker.mjs src/kv-usage.mjs \
            src/subtitles.js src/token.js src/translator.js \
            test/kv-usage.test.js test/v2-part4-5-malaysian-prompt.test.js \
            scripts/kv-usage-report.mjs
          git rm -- SmartSubs_KV_Usage_Tracker_Patch.zip
          git commit -m 'Apply SmartSubs KV usage tracker patch (checks passed)'
          git push origin HEAD:main
