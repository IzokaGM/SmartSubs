name: SmartSubs M21 Bootstrap CI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubs-m21-bootstrap
  cancel-in-progress: false

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Write SmartSubs M21 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src test
          cat > 'package.json' <<'__SMARTSUBS_M21_EOF__'
          {
            "name": "smartsubs",
            "version": "2.1.0",
            "private": true,
            "type": "module",
            "scripts": {
              "check": "node --check src/index.js && node --check src/selector.js && node --check src/subtitles.js && node --check src/translator.js && node --check src/utils.js && node --check src/config.js",
              "test": "node --test",
              "ci": "npm run check && npm test"
            },
            "devDependencies": {
              "wrangler": "^4.29.1"
            }
          }
          __SMARTSUBS_M21_EOF__

          cat > '.gitignore' <<'__SMARTSUBS_M21_EOF__'
          node_modules/
          .wrangler/
          .dev.vars
          .env
          .DS_Store
          __SMARTSUBS_M21_EOF__

          cat > 'README.md' <<'__SMARTSUBS_M21_EOF__'
          # SmartSubs M21
          
          Fast Malay subtitles for Stremio using OpenSubtitles v3, Gemini 3.5 Flash-Lite, Cloudflare Queues, and SQLite-backed Durable Objects.
          
          ## M21 goals
          
          - Prefer a strongly matched native Malay subtitle when confidence is good.
          - Otherwise translate the best-matched English subtitle.
          - Start translation as soon as Stremio requests subtitle choices.
          - Translate up to three large chunks in parallel with five-cue context overlap, reducing Gemini round trips.
          - Use one Durable Object per exact source subtitle for single-flight translation and persistent VTT caching.
          - Keep the existing BYOK approach without adding expiry or revocation.
          - Keep runtime work on Cloudflare. GitHub Actions is used only for source generation, checks, tests, and commits.
          
          ## Cloudflare setup
          
          1. `npm install`
          2. Create the queue once: `npx wrangler queues create smartsubs-translation`
          3. Set a long random configuration secret: `npx wrangler secret put CONFIG_SECRET`
          4. Deploy: `npx wrangler deploy`
          5. Open `https://YOUR-WORKER.workers.dev/configure`, enter your Gemini key, and install the generated manifest URL in Stremio.
          
          Optional fallback for direct unconfigured use: `npx wrangler secret put GEMINI_API_KEY`.
          
          The default model is `gemini-3.5-flash-lite`. The Gemini key is encrypted into the configured add-on token. M21 intentionally does not add token expiry or revocation.
          __SMARTSUBS_M21_EOF__

          cat > 'wrangler.jsonc' <<'__SMARTSUBS_M21_EOF__'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "smartsubs",
            "main": "src/index.js",
            "compatibility_date": "2026-08-20",
            "compatibility_flags": ["nodejs_compat"],
            "vars": {
              "GEMINI_MODEL": "gemini-3.5-flash-lite",
              "TRANSLATION_CONCURRENCY": "3",
              "TRANSLATION_CHUNK_SIZE": "240",
              "TRANSLATION_CONTEXT_OVERLAP": "5",
              "OPENSUBTITLES_V3_URL": "https://opensubtitles-v3.strem.io"
            },
            "durable_objects": {
              "bindings": [
                { "name": "TRANSLATION_JOBS", "class_name": "TranslationJob" }
              ]
            },
            "migrations": [
              { "tag": "v1", "new_sqlite_classes": ["TranslationJob"] }
            ],
            "queues": {
              "producers": [
                { "binding": "TRANSLATION_QUEUE", "queue": "smartsubs-translation" }
              ],
              "consumers": [
                { "queue": "smartsubs-translation", "max_batch_size": 3, "max_batch_timeout": 1, "max_retries": 2 }
              ]
            }
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/utils.js' <<'__SMARTSUBS_M21_EOF__'
          export function parseExtra(extra = "") {
            const decoded = decodeURIComponent(extra || "");
            const params = new URLSearchParams(decoded === "*" ? "" : decoded);
            const out = {};
            for (const [key, value] of params) out[key] = value;
            return out;
          }
          
          export function textOfCandidate(candidate) {
            if (!candidate || typeof candidate !== "object") return "";
            const fields = [
              candidate.id,
              candidate.name,
              candidate.fileName,
              candidate.filename,
              candidate.release,
              candidate.url,
              candidate.subFileName,
              candidate.title,
            ];
            return fields.filter(Boolean).join(" ");
          }
          
          export function normaliseRelease(text = "") {
            return String(text)
              .toLowerCase()
              .replace(/\b(1080p|2160p|720p|480p|web[ ._-]?dl|webrip|bluray|brrip|hdrip|dvdrip|x26[45]|h\.?26[45]|hevc|av1|hdr10\+?|hdr|dolby[ ._-]?vision|dv|ddp?\d(?:\.\d)?|aac\d(?:\.\d)?)\b/g, " $1 ")
              .replace(/[^a-z0-9]+/g, " ")
              .trim();
          }
          
          export function tokenSet(text = "") {
            return new Set(normaliseRelease(text).split(/\s+/).filter((x) => x.length > 1));
          }
          
          export function jaccard(a, b) {
            if (!a.size || !b.size) return 0;
            let intersection = 0;
            for (const x of a) if (b.has(x)) intersection += 1;
            return intersection / (a.size + b.size - intersection);
          }
          
          export function extractReleaseFacts(text = "") {
            const s = String(text).toLowerCase();
            const pick = (patterns) => patterns.find(([re]) => re.test(s))?.[1] || null;
            return {
              resolution: pick([[/2160p|4k/, "2160p"], [/1080p/, "1080p"], [/720p/, "720p"], [/480p/, "480p"]]),
              source: pick([[/web[ ._-]?dl/, "webdl"], [/webrip/, "webrip"], [/blu[ ._-]?ray|bluray|brrip/, "bluray"], [/hdrip/, "hdrip"], [/dvdrip/, "dvdrip"]]),
              codec: pick([[/x265|h\.?265|hevc/, "hevc"], [/x264|h\.?264|avc/, "avc"], [/\bav1\b/, "av1"]]),
              dynamicRange: pick([[/dolby[ ._-]?vision|\bdv\b/, "dv"], [/hdr10\+/, "hdr10+"], [/\bhdr\b/, "hdr"]]),
            };
          }
          
          export async function sha256Hex(value) {
            const data = new TextEncoder().encode(String(value));
            const digest = await crypto.subtle.digest("SHA-256", data);
            return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
          }
          
          export function json(data, init = {}) {
            const headers = new Headers(init.headers || {});
            headers.set("content-type", "application/json; charset=utf-8");
            headers.set("access-control-allow-origin", "*");
            return new Response(JSON.stringify(data), { ...init, headers });
          }
          
          export function withCors(response) {
            const headers = new Headers(response.headers);
            headers.set("access-control-allow-origin", "*");
            headers.set("access-control-allow-headers", "content-type");
            headers.set("access-control-allow-methods", "GET,OPTIONS");
            return new Response(response.body, { status: response.status, statusText: response.statusText, headers });
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/config.js' <<'__SMARTSUBS_M21_EOF__'
          function b64url(bytes) {
            let binary = "";
            for (const b of bytes) binary += String.fromCharCode(b);
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
          }
          
          function fromB64url(value) {
            const base = String(value).replace(/-/g, "+").replace(/_/g, "/");
            const padded = base + "=".repeat((4 - (base.length % 4)) % 4);
            const binary = atob(padded);
            return Uint8Array.from(binary, (c) => c.charCodeAt(0));
          }
          
          async function aesKey(secret) {
            if (!secret) throw new Error("CONFIG_SECRET is not configured");
            const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret));
            return crypto.subtle.importKey("raw", digest, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
          }
          
          export async function sealConfig(config, secret) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await aesKey(secret);
            const plain = new TextEncoder().encode(JSON.stringify({
              apiKey: String(config.apiKey || "").trim(),
              model: String(config.model || "gemini-3.5-flash-lite").trim(),
            }));
            if (!JSON.parse(new TextDecoder().decode(plain)).apiKey) throw new Error("Gemini API key is required");
            const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain));
            const joined = new Uint8Array(iv.length + cipher.length);
            joined.set(iv, 0);
            joined.set(cipher, iv.length);
            return b64url(joined);
          }
          
          export async function openConfig(token, secret) {
            const packed = fromB64url(token);
            if (packed.length < 29) throw new Error("Invalid SmartSubs configuration token");
            const iv = packed.slice(0, 12);
            const cipher = packed.slice(12);
            const key = await aesKey(secret);
            let plain;
            try {
              plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
            } catch {
              throw new Error("Invalid SmartSubs configuration token");
            }
            const config = JSON.parse(new TextDecoder().decode(plain));
            if (!config.apiKey) throw new Error("SmartSubs configuration has no Gemini API key");
            return config;
          }
          
          export function configureHtml(origin) {
            return `<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartSubs</title>
          <style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:680px;margin:48px auto;padding:0 20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#1c1c1c;color:#fff}button{cursor:pointer;font-weight:700}small{color:#aaa}#out{word-break:break-all;margin-top:16px}</style></head>
          <body><h1>SmartSubs</h1><p>Fast Malay subtitle translation. Your Gemini key is encrypted into the configured add-on URL and is not stored in GitHub.</p>
          <label>Gemini API key</label><input id="key" type="password" autocomplete="off" placeholder="AIza...">
          <label>Model</label><input id="model" value="gemini-3.5-flash-lite">
          <button id="make">Create configured manifest</button><div id="out"></div>
          <small>No expiry or revocation layer is added in M21.</small>
          <script>
          document.getElementById('make').onclick=async()=>{const out=document.getElementById('out');out.textContent='Creating...';const r=await fetch('/configure/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({apiKey:document.getElementById('key').value,model:document.getElementById('model').value})});const j=await r.json();if(!r.ok){out.textContent=j.error||'Failed';return}out.innerHTML='<p>Install this manifest in Stremio:</p><a style="color:#9cf" href="'+j.manifestUrl+'">'+j.manifestUrl+'</a>'};
          </script></body></html>`;
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/selector.js' <<'__SMARTSUBS_M21_EOF__'
          import { extractReleaseFacts, jaccard, textOfCandidate, tokenSet } from "./utils.js";
          
          const MALAY_CODES = new Set(["may", "msa", "ms", "mal", "malay"]);
          const ENGLISH_CODES = new Set(["eng", "en", "english"]);
          
          function langCode(item) {
            return String(item?.lang || item?.language || "").toLowerCase();
          }
          
          export function isMalay(item) {
            return MALAY_CODES.has(langCode(item));
          }
          
          export function isEnglish(item) {
            return ENGLISH_CODES.has(langCode(item));
          }
          
          function factScore(videoFacts, candidateFacts) {
            let score = 0;
            for (const key of ["resolution", "source", "codec", "dynamicRange"]) {
              if (videoFacts[key] && candidateFacts[key]) score += videoFacts[key] === candidateFacts[key] ? 18 : -14;
            }
            return score;
          }
          
          function exactEvidence(candidate, extra) {
            const text = textOfCandidate(candidate).toLowerCase();
            let score = 0;
            const hash = String(extra.videoHash || extra.videohash || "").toLowerCase();
            const size = String(extra.videoSize || extra.videosize || "");
            if (hash && text.includes(hash)) score += 140;
            if (size && text.includes(size)) score += 45;
            return score;
          }
          
          export function scoreCandidate(candidate, extra = {}, sourceIndex = 0) {
            const videoName = extra.filename || extra.fileName || extra.name || "";
            const candidateText = textOfCandidate(candidate);
            let score = exactEvidence(candidate, extra);
          
            if (videoName && candidateText) {
              score += Math.round(jaccard(tokenSet(videoName), tokenSet(candidateText)) * 95);
              score += factScore(extractReleaseFacts(videoName), extractReleaseFacts(candidateText));
            }
          
            // OpenSubtitles v3 already ranks matches. Preserve a modest bonus for early results
            // when detailed release metadata is absent.
            score += Math.max(0, 24 - sourceIndex * 3);
            return score;
          }
          
          export function rankByLanguage(subtitles, predicate, extra = {}) {
            return subtitles
              .map((item, index) => ({ item, index, score: scoreCandidate(item, extra, index) }))
              .filter(({ item }) => predicate(item))
              .sort((a, b) => b.score - a.score || a.index - b.index);
          }
          
          export function chooseSubtitlePlan(subtitles = [], extra = {}) {
            const malay = rankByLanguage(subtitles, isMalay, extra);
            const english = rankByLanguage(subtitles, isEnglish, extra);
            const bestMalay = malay[0] || null;
            const bestEnglish = english[0] || null;
          
            if (!bestEnglish && bestMalay) return { mode: "native", bestMalay, bestEnglish: null, reason: "no-english" };
            if (!bestMalay && bestEnglish) return { mode: "translate", bestMalay: null, bestEnglish, reason: "no-malay" };
            if (!bestMalay && !bestEnglish) return { mode: "none", bestMalay: null, bestEnglish: null, reason: "no-supported-source" };
          
            const videoHasReleaseInfo = Boolean(extra.filename || extra.fileName || extra.videoHash || extra.videohash || extra.videoSize || extra.videosize);
            const nativeFloor = videoHasReleaseInfo ? 50 : 22;
            const nativeWins = bestMalay.score >= nativeFloor && bestMalay.score >= bestEnglish.score - 10;
          
            if (nativeWins) return { mode: "native", bestMalay, bestEnglish, reason: "native-confidence" };
            return { mode: "translate", bestMalay, bestEnglish, reason: "english-better-match" };
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/subtitles.js' <<'__SMARTSUBS_M21_EOF__'
          function parseTime(raw) {
            const m = String(raw).trim().match(/(?:(\d+):)?(\d{2}):(\d{2})[,.](\d{3})/);
            if (!m) return null;
            const h = Number(m[1] || 0);
            return ((h * 60 + Number(m[2])) * 60 + Number(m[3])) * 1000 + Number(m[4]);
          }
          
          function formatTime(ms) {
            const total = Math.max(0, Math.round(ms));
            const h = Math.floor(total / 3600000);
            const m = Math.floor((total % 3600000) / 60000);
            const s = Math.floor((total % 60000) / 1000);
            const milli = total % 1000;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(milli).padStart(3, "0")}`;
          }
          
          export function parseSubtitle(text = "") {
            const clean = String(text).replace(/^\uFEFF/, "").replace(/\r/g, "");
            const blocks = clean.replace(/^WEBVTT[^\n]*\n+/i, "").split(/\n{2,}/);
            const cues = [];
            for (const block of blocks) {
              const lines = block.split("\n").filter((x) => x.trim().length);
              const timingIndex = lines.findIndex((line) => line.includes("-->"));
              if (timingIndex < 0) continue;
              const [left, rightRaw] = lines[timingIndex].split("-->");
              const right = rightRaw?.trim().split(/\s+/)[0];
              const start = parseTime(left);
              const end = parseTime(right);
              if (start == null || end == null || end < start) continue;
              const body = lines.slice(timingIndex + 1).join("\n").trim();
              if (!body) continue;
              cues.push({ index: cues.length, start, end, text: body });
            }
            return cues;
          }
          
          export function toVtt(cues = []) {
            const body = cues.map((cue) => `${formatTime(cue.start)} --> ${formatTime(cue.end)}\n${cue.text}`).join("\n\n");
            return `WEBVTT\n\n${body}\n`;
          }
          
          export function buildChunks(cues, targetSize = 110, overlap = 5) {
            if (!Array.isArray(cues) || cues.length === 0) return [];
            const chunks = [];
            for (let start = 0; start < cues.length; start += targetSize) {
              const end = Math.min(cues.length, start + targetSize);
              const contextStart = Math.max(0, start - overlap);
              const contextEnd = Math.min(cues.length, end + overlap);
              chunks.push({
                targetStart: start,
                targetEnd: end,
                cues: cues.slice(contextStart, contextEnd),
                targetIndices: cues.slice(start, end).map((c) => c.index),
              });
            }
            return chunks;
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/translator.js' <<'__SMARTSUBS_M21_EOF__'
          import { buildChunks, parseSubtitle, toVtt } from "./subtitles.js";
          
          const SYSTEM_PROMPT = `You translate English subtitle dialogue into natural conversational Bahasa Melayu for Malaysian viewers.
          Rules:
          1. Preserve meaning, tone, humour, slang, names, speaker labels, HTML/SSA tags and line breaks where practical.
          2. Do not translate proper names unless Malay normally translates them.
          3. Prefer concise spoken Malay that fits subtitle timing. Avoid stiff literal wording.
          4. Context cues marked contextOnly help continuity. Do not output them.
          5. Return ONLY valid JSON: an array of objects {"i":number,"text":string} for requested target indices, exactly once each.`;
          
          function modelText(payload) {
            const parts = payload?.candidates?.[0]?.content?.parts || [];
            return parts.map((p) => p.text || "").join("").trim();
          }
          
          function parseModelJson(text) {
            const stripped = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
            const value = JSON.parse(stripped);
            if (!Array.isArray(value)) throw new Error("Gemini did not return an array");
            return value;
          }
          
          async function geminiCall({ apiKey, model, prompt, thinkingLevel = "MINIMAL" }) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-goog-api-key": apiKey,
              },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                  responseMimeType: "application/json",
                  thinkingConfig: { thinkingLevel },
                },
              }),
            });
            if (!response.ok) throw new Error(`Gemini ${response.status}: ${(await response.text()).slice(0, 300)}`);
            return parseModelJson(modelText(await response.json()));
          }
          
          function chunkPrompt(chunk) {
            const targets = new Set(chunk.targetIndices);
            return JSON.stringify({
              targetIndices: chunk.targetIndices,
              cues: chunk.cues.map((cue) => ({ i: cue.index, contextOnly: !targets.has(cue.index), text: cue.text })),
            });
          }
          
          async function translateChunk(args, chunk) {
            let rows;
            try {
              rows = await geminiCall({ ...args, prompt: chunkPrompt(chunk), thinkingLevel: "MINIMAL" });
            } catch (firstError) {
              rows = await geminiCall({ ...args, prompt: chunkPrompt(chunk), thinkingLevel: "LOW" });
            }
            const wanted = new Set(chunk.targetIndices);
            const out = new Map();
            for (const row of rows) {
              const i = Number(row?.i);
              if (!wanted.has(i) || typeof row?.text !== "string" || !row.text.trim()) continue;
              out.set(i, row.text.trim());
            }
            if (out.size !== wanted.size) throw new Error(`Gemini returned ${out.size}/${wanted.size} translated cues`);
            return out;
          }
          
          export async function translateSubtitleText(text, { apiKey, model = "gemini-3.5-flash-lite", concurrency = 3, chunkSize = 110, overlap = 5 } = {}) {
            if (!apiKey) throw new Error("GEMINI_API_KEY is not configured");
            const cues = parseSubtitle(text);
            if (!cues.length) throw new Error("No subtitle cues were parsed");
            const chunks = buildChunks(cues, chunkSize, overlap);
            const translated = new Map();
          
            for (let cursor = 0; cursor < chunks.length; cursor += concurrency) {
              const group = chunks.slice(cursor, cursor + concurrency);
              const maps = await Promise.all(group.map((chunk) => translateChunk({ apiKey, model }, chunk)));
              for (const map of maps) for (const [i, value] of map) translated.set(i, value);
            }
          
            const output = cues.map((cue) => ({ ...cue, text: translated.get(cue.index) || cue.text }));
            return toVtt(output);
          }
          
          export async function fetchSubtitleText(sourceUrl) {
            const response = await fetch(sourceUrl, {
              headers: { "user-agent": "SmartSubs/2.1 (+subtitle translation)" },
              redirect: "follow",
            });
            if (!response.ok) throw new Error(`Subtitle source ${response.status}`);
            const text = await response.text();
            if (!text.trim()) throw new Error("Subtitle source was empty");
            return text;
          }
          __SMARTSUBS_M21_EOF__

          cat > 'src/index.js' <<'__SMARTSUBS_M21_EOF__'
          import { DurableObject } from "cloudflare:workers";
          import { configureHtml, openConfig, sealConfig } from "./config.js";
          import { chooseSubtitlePlan } from "./selector.js";
          import { fetchSubtitleText, translateSubtitleText } from "./translator.js";
          import { json, parseExtra, sha256Hex, withCors } from "./utils.js";
          
          const BASE_MANIFEST = {
            id: "org.smartsubs.malay",
            version: "2.1.0",
            name: "SmartSubs",
            description: "Fast Smart Malay subtitles using OpenSubtitles v3 and Gemini.",
            resources: ["subtitles"],
            types: ["movie", "series"],
            idPrefixes: ["tt"],
            catalogs: [],
          };
          
          function manifest(configured) {
            return {
              ...BASE_MANIFEST,
              behaviorHints: { configurable: true, configurationRequired: !configured },
            };
          }
          
          function upstreamBase(env) {
            return String(env.OPENSUBTITLES_V3_URL || "https://opensubtitles-v3.strem.io").replace(/\/$/, "");
          }
          
          async function fetchOpenSubtitles(type, id, extra, env) {
            const suffix = extra && extra !== "*" ? `/${extra}` : "";
            const url = `${upstreamBase(env)}/subtitles/${encodeURIComponent(type)}/${encodeURIComponent(id)}${suffix}.json`;
            const response = await fetch(url, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error(`OpenSubtitles v3 ${response.status}`);
            const data = await response.json();
            return Array.isArray(data?.subtitles) ? data.subtitles : [];
          }
          
          function stableSourceIdentity(candidate) {
            const url = new URL(candidate.url);
            url.search = "";
            return [candidate.id || "", candidate.lang || "", url.toString()].join("|");
          }
          
          async function translationKey(candidate, model) {
            return sha256Hex(`${stableSourceIdentity(candidate)}|${model}|m21-context-v1`);
          }
          
          function routeContext(pathname) {
            const configured = pathname.match(/^\/c\/([A-Za-z0-9_-]+)(\/.*)$/);
            if (configured) return { token: configured[1], path: configured[2], configured: true };
            return { token: null, path: pathname, configured: false };
          }
          
          async function smartSubtitles(request, env, route) {
            const url = new URL(request.url);
            const match = route.path.match(/^\/subtitles\/(movie|series)\/([^/]+)(?:\/(.*))?\.json$/);
            if (!match) return null;
            if (!route.token && !env.GEMINI_API_KEY) throw new Error("Configure SmartSubs first at /configure");
          
            const [, type, encodedId, rawExtra = ""] = match;
            const id = decodeURIComponent(encodedId);
            const extraString = rawExtra || "";
            const extra = parseExtra(extraString);
            const config = route.token ? await openConfig(route.token, env.CONFIG_SECRET) : { apiKey: env.GEMINI_API_KEY, model: env.GEMINI_MODEL || "gemini-3.5-flash-lite" };
            const subtitles = await fetchOpenSubtitles(type, id, extraString, env);
            const plan = chooseSubtitlePlan(subtitles, extra);
            const result = [];
          
            if (plan.mode === "native" && plan.bestMalay?.item?.url) {
              result.push({ id: `smartsubs-native-${plan.bestMalay.item.id || "ms"}`, url: plan.bestMalay.item.url, lang: "Malay" });
            } else if (plan.mode === "translate" && plan.bestEnglish?.item?.url) {
              const source = plan.bestEnglish.item;
              const model = config.model || env.GEMINI_MODEL || "gemini-3.5-flash-lite";
              const key = await translationKey(source, model);
              const job = env.TRANSLATION_JOBS.getByName(key);
              await job.ensure({ key, sourceUrl: source.url, model, token: route.token || null });
              const prefix = route.token ? `/c/${route.token}` : "";
              result.push({ id: `smartsubs-auto-${key.slice(0, 12)}`, url: `${url.origin}${prefix}/vtt/${key}.vtt`, lang: "Malay Auto" });
            }
          
            return json({ subtitles: result }, { headers: { "cache-control": "public, max-age=30" } });
          }
          
          async function translatedVtt(env, route) {
            const match = route.path.match(/^\/vtt\/([a-f0-9]{64})\.vtt$/);
            if (!match) return null;
            const key = match[1];
            const job = env.TRANSLATION_JOBS.getByName(key);
            const vtt = await job.getOrRun(route.token || null);
            return new Response(vtt, {
              headers: {
                "content-type": "text/vtt; charset=utf-8",
                "cache-control": "public, max-age=31536000, immutable",
                "access-control-allow-origin": "*",
              },
            });
          }
          
          export class TranslationJob extends DurableObject {
            constructor(ctx, env) {
              super(ctx, env);
              this.inflight = null;
            }
          
            async ensure(payload) {
              const cached = await this.ctx.storage.get("vtt");
              if (cached) return { status: "ready" };
              await this.ctx.storage.put("payload", payload);
              const status = await this.ctx.storage.get("status");
              if (status !== "queued" && status !== "running") {
                await this.ctx.storage.put("status", "queued");
                await this.env.TRANSLATION_QUEUE.send(payload);
              }
              return { status: "queued" };
            }
          
            async getOrRun(requestToken = null) {
              const cached = await this.ctx.storage.get("vtt");
              if (cached) return cached;
              const payload = await this.ctx.storage.get("payload");
              if (!payload) throw new Error("Translation job payload is missing");
              if (requestToken && !payload.token) payload.token = requestToken;
              return this.run(payload);
            }
          
            async run(payload) {
              const cached = await this.ctx.storage.get("vtt");
              if (cached) return cached;
              if (this.inflight) return this.inflight;
          
              this.inflight = (async () => {
                await this.ctx.storage.put("status", "running");
                try {
                  const config = payload.token
                    ? await openConfig(payload.token, this.env.CONFIG_SECRET)
                    : { apiKey: this.env.GEMINI_API_KEY, model: payload.model || this.env.GEMINI_MODEL };
                  const sourceText = await fetchSubtitleText(payload.sourceUrl);
                  const vtt = await translateSubtitleText(sourceText, {
                    apiKey: config.apiKey,
                    model: payload.model || config.model || this.env.GEMINI_MODEL || "gemini-3.5-flash-lite",
                    concurrency: Number(this.env.TRANSLATION_CONCURRENCY || 3),
                    chunkSize: Number(this.env.TRANSLATION_CHUNK_SIZE || 240),
                    overlap: Number(this.env.TRANSLATION_CONTEXT_OVERLAP || 5),
                  });
                  if (new TextEncoder().encode(vtt).byteLength > 1_900_000) throw new Error("Translated subtitle exceeds Durable Object cache size safety limit");
                  await this.ctx.storage.put({ vtt, status: "ready", readyAt: Date.now() });
                  await this.ctx.storage.delete("payload");
                  return vtt;
                } catch (error) {
                  await this.ctx.storage.put({ status: "failed", error: String(error?.message || error).slice(0, 500), failedAt: Date.now() });
                  throw error;
                } finally {
                  this.inflight = null;
                }
              })();
          
              return this.inflight;
            }
          }
          
          export default {
            async fetch(request, env) {
              try {
                if (request.method === "OPTIONS") return withCors(new Response(null, { status: 204 }));
                const url = new URL(request.url);
                const route = routeContext(url.pathname);
          
                if (url.pathname === "/") return Response.redirect(`${url.origin}/configure`, 302);
                if (url.pathname === "/configure" && request.method === "GET") return new Response(configureHtml(url.origin), { headers: { "content-type": "text/html; charset=utf-8" } });
                if (url.pathname === "/configure/token" && request.method === "POST") {
                  const body = await request.json();
                  const token = await sealConfig(body, env.CONFIG_SECRET);
                  return json({ manifestUrl: `${url.origin}/c/${token}/manifest.json` });
                }
                if (route.path === "/manifest.json") return json(manifest(route.configured), { headers: { "cache-control": "public, max-age=3600" } });
          
                const subtitleResponse = await smartSubtitles(request, env, route);
                if (subtitleResponse) return subtitleResponse;
                const vttResponse = await translatedVtt(env, route);
                if (vttResponse) return vttResponse;
                if (route.path === "/health") return json({ ok: true, version: BASE_MANIFEST.version });
                return json({ error: "not found" }, { status: 404 });
              } catch (error) {
                return json({ error: String(error?.message || error) }, { status: 502 });
              }
            },
          
            async queue(batch, env) {
              await Promise.all(batch.messages.map(async (message) => {
                try {
                  const payload = message.body;
                  const job = env.TRANSLATION_JOBS.getByName(payload.key);
                  await job.run(payload);
                  message.ack();
                } catch {
                  message.retry({ delaySeconds: 5 });
                }
              }));
            },
          };
          __SMARTSUBS_M21_EOF__

          cat > 'test/config.test.js' <<'__SMARTSUBS_M21_EOF__'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { openConfig, sealConfig } from "../src/config.js";
          
          test("BYOK configuration round trips without expiry fields", async () => {
            const token = await sealConfig({ apiKey: "test-key", model: "gemini-3.5-flash-lite" }, "secret");
            const cfg = await openConfig(token, "secret");
            assert.equal(cfg.apiKey, "test-key");
            assert.equal(cfg.model, "gemini-3.5-flash-lite");
            assert.equal(cfg.expiresAt, undefined);
          });
          
          test("wrong config secret cannot decrypt token", async () => {
            const token = await sealConfig({ apiKey: "test-key" }, "secret-a");
            await assert.rejects(() => openConfig(token, "secret-b"), /Invalid SmartSubs/);
          });
          __SMARTSUBS_M21_EOF__

          cat > 'test/selector.test.js' <<'__SMARTSUBS_M21_EOF__'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { chooseSubtitlePlan, scoreCandidate } from "../src/selector.js";
          
          const mk = (lang, name, id = name) => ({ lang, name, id, url: `https://example.com/${encodeURIComponent(name)}.srt` });
          
          test("matching native Malay wins", () => {
            const extra = { filename: "Silo.S03E02.2160p.WEB-DL.DV.HDR.x265-GROUP.mkv" };
            const plan = chooseSubtitlePlan([
              mk("msa", "Silo.S03E02.2160p.WEB-DL.DV.HDR.x265-GROUP"),
              mk("eng", "Silo.S03E02.2160p.WEB-DL.DV.HDR.x265-GROUP"),
            ], extra);
            assert.equal(plan.mode, "native");
          });
          
          test("mismatched Malay loses to matching English", () => {
            const extra = { filename: "Silo.S03E02.2160p.WEB-DL.DV.HDR.x265-GROUP.mkv" };
            const plan = chooseSubtitlePlan([
              mk("msa", "Silo.S03E02.1080p.BluRay.x264-OTHER"),
              mk("eng", "Silo.S03E02.2160p.WEB-DL.DV.HDR.x265-GROUP"),
            ], extra);
            assert.equal(plan.mode, "translate");
            assert.equal(plan.reason, "english-better-match");
          });
          
          test("exact hash evidence dominates", () => {
            const hash = "deadbeefcafebabe";
            const strong = scoreCandidate(mk("eng", `Movie.${hash}.WEB-DL`), { filename: "Movie.WEB-DL.mkv", videoHash: hash }, 10);
            const weak = scoreCandidate(mk("eng", "Movie.WEB-DL"), { filename: "Movie.WEB-DL.mkv", videoHash: hash }, 0);
            assert.ok(strong > weak + 100);
          });
          __SMARTSUBS_M21_EOF__

          cat > 'test/subtitles.test.js' <<'__SMARTSUBS_M21_EOF__'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { buildChunks, parseSubtitle, toVtt } from "../src/subtitles.js";
          
          test("parses SRT and emits VTT", () => {
            const srt = `1\n00:00:01,000 --> 00:00:03,000\nHello.\n\n2\n00:00:04,200 --> 00:00:05,500\nWorld.`;
            const cues = parseSubtitle(srt);
            assert.equal(cues.length, 2);
            assert.match(toVtt(cues), /^WEBVTT/);
            assert.match(toVtt(cues), /00:00:01\.000 --> 00:00:03\.000/);
          });
          
          test("context overlap never changes target ownership", () => {
            const cues = Array.from({ length: 250 }, (_, i) => ({ index: i, start: i * 1000, end: i * 1000 + 900, text: String(i) }));
            const chunks = buildChunks(cues, 100, 5);
            assert.deepEqual(chunks.map((c) => c.targetIndices.length), [100, 100, 50]);
            assert.equal(chunks[1].cues[0].index, 95);
            assert.equal(chunks[1].targetIndices[0], 100);
          });
          __SMARTSUBS_M21_EOF__

          cat > 'test/utils.test.js' <<'__SMARTSUBS_M21_EOF__'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { extractReleaseFacts, normaliseRelease, parseExtra, sha256Hex } from "../src/utils.js";
          
          test("parses Stremio extra values", () => {
            const x = parseExtra("filename=Movie.2160p.WEB-DL.mkv&videoHash=abc");
            assert.equal(x.videoHash, "abc");
            assert.match(x.filename, /2160p/);
          });
          
          test("extracts release facts", () => {
            assert.deepEqual(extractReleaseFacts("Movie.2160p.WEB-DL.DV.x265"), {
              resolution: "2160p", source: "webdl", codec: "hevc", dynamicRange: "dv",
            });
            assert.match(normaliseRelease("A.WEB-DL.x265"), /web/);
          });
          
          test("sha256 is stable", async () => {
            assert.equal((await sha256Hex("abc")).length, 64);
            assert.equal(await sha256Hex("abc"), await sha256Hex("abc"));
          });
          __SMARTSUBS_M21_EOF__

          rm -f "d kt"

      - name: Install development dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate source and tests
        run: |
          set -euo pipefail
          npm run ci
          git diff --check

      - name: Validate Cloudflare bundle only
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Confirm CI has no runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GEMINI_API_KEY:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          echo "CI uses no Gemini or Cloudflare runtime secrets."

      - name: Commit M21 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry-run node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "SmartSubs M21 fast accurate translation [skip ci]"
          git push origin HEAD:main
