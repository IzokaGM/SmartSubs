name: SmartSubs Bootstrap and CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: smartsubs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-or-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap SmartSubs source when needed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package.json ]]; then
            echo "SmartSubs source already exists. Running validation only."
            exit 0
