          actual="$(sha256sum /tmp/smartsubs-source.tar.gz | awk '{print $1}')"

          if [[ "$actual" != "$expected" ]]; then
            echo "Embedded source archive checksum mismatch."
            exit 1
          fi

          tar -xzf /tmp/smartsubs-source.tar.gz
          rm -f -- "d kt"

          test -f package.json
          test -f src/cloudflare-worker.mjs
          test -f wrangler.jsonc

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Commit bootstrapped source
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No source changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Bootstrap SmartSubs source [skip ci]"
          git push origin HEAD:main

  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify repository is bootstrapped
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/cloudflare-worker.mjs
          test -f wrangler.jsonc

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test
