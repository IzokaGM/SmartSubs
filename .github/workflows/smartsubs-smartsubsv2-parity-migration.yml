name: SmartSubs - SmartSubsV2 Final Parity Migration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartsubs-smartsubsv2-final-parity
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SmartSubs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify SmartSubs target and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_hashes = json.loads(r'''{
            "README.md": "fd44aa3138032652979ef5c2a065406ffdc5eafa087ac21d1c920eba5ccd769a",
            "START_HERE.md": "8ccd1e3d0a5bf3f5fc34ad198eabe2b547ddbf3ba80033c840cd375c1718a5a2",
            "src/cloudflare-worker.mjs": "192ec7f05a202e617cc94ed04f262a940293dff595e5345ea246830db3cdcf8d",
            "src/configure.js": "2aeffa6062c5510dc3222756ba95135b7155a983ac2da08a967c326b51b4d814",
            "src/diagnostics.js": "cc7411c2cc956ce795fa2b268dc170fd85e2696045efe4872f8cca9b2b193113",
            "src/selector.js": "c245f7f48efb72692b1d85558ee4b9438b328c52ec0f73205bd4e18b249c85d2",
            "src/subtitles.js": "e678d65b223ad1e05290f2a0bb90454fd551c1b765de42a46282acab6678ee48",
            "src/translator.js": "fa18b01831344ec4b2402685fde8c83f2ecd68dd68dcc2b750055736c02594fe",
            "test/nuvio-worker.test.js": "cb72769ec1de8f1897fcff8d2c33939844b8da0e3b5c6f5c17b7893ddd2982af",
            "wrangler.jsonc": "1c9834315f802af3de5ea9b340d99679aae9439b2a149ffb6cdcaeb7106751fb"
          }''')
          new_paths = json.loads(r'''[
            "docs/SMARTSUBSV2_PARITY_PORT.md",
            "package-lock.json",
            "test/smartsubs-parity-identity.test.js",
            "test/v2-baseline-diagnose-link.test.js",
            "test/v2-part1a-english-source-diagnose.test.js",
            "test/v2-part1a2-friendly-diagnose.test.js",
            "test/v2-part2-native-malay-ranking.test.js",
            "test/v2-part3-1-selected-auto-queue-v2.test.js",
            "test/v2-part3-native-safe-fallback.test.js",
            "test/v2-part4-1-stable-auto-delivery.test.js",
            "test/v2-part4-2-auto-delivery-race.test.js",
            "test/v2-part4-3-strong-delivery-relay.test.js",
            "test/v2-part4-4-built-in-english.test.js",
            "test/v2-part4-5-malaysian-prompt.test.js",
            "test/v2-part4-fast-user-selected-auto.test.js"
          ]''')

          manifest = Path('src/manifest.js').read_text()
          wrangler = Path('wrangler.jsonc').read_text()
          if "id: 'community.smartsubs'" not in manifest or "name: 'SmartSubs'" not in manifest:
              raise SystemExit('This workflow must run in the SmartSubs repository')
          if '"name": "smartsubs"' not in wrangler:
              raise SystemExit('SmartSubs Worker identity was not found')
          if '"queue": "smartsubs-translation"' not in wrangler:
              raise SystemExit('SmartSubs production Queue identity was not found')

          already_applied = all([
              Path('test/smartsubs-parity-identity.test.js').exists(),
              'Malaysian Bahasa Melayu' in Path('src/translator.js').read_text(),
              'TranslationDeliveryRelay' in Path('src/cloudflare-worker.mjs').read_text(),
              'SMARTSUBS_DELIVERY' in wrangler,
          ])

          if not already_applied:
              for relative, expected in expected_hashes.items():
                  path = Path(relative)
                  if not path.is_file():
                      raise SystemExit(f'Baseline file is missing: {relative}')
                  actual = hashlib.sha256(path.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(
                          f'Baseline changed for {relative}. Expected {expected}, got {actual}'
                      )
              unexpected_existing = [relative for relative in new_paths if Path(relative).exists()]
              if unexpected_existing:
                  raise SystemExit(
                      'Files expected to be new already exist: ' + ', '.join(unexpected_existing)
                  )
          PY

      - name: Apply completed SmartSubsV2 behaviour to SmartSubs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          from pathlib import Path

          payloads = json.loads(r'''{
            "README.md": "",
            "START_HERE.md": "",
            "docs/SMARTSUBSV2_PARITY_PORT.md": "",
            "package-lock.json": "",
            "src/cloudflare-worker.mjs": "",
            "src/configure.js": "",
            "src/diagnostics.js": "",
            "src/selector.js": "",
            "src/subtitles.js": "",
            "src/translator.js": "",
            "test/nuvio-worker.test.js": "",
            "test/smartsubs-parity-identity.test.js": "",
            "test/v2-baseline-diagnose-link.test.js": "",
            "test/v2-part1a-english-source-diagnose.test.js": "",
            "test/v2-part1a2-friendly-diagnose.test.js": "",
            "test/v2-part2-native-malay-ranking.test.js": "",
            "test/v2-part3-1-selected-auto-queue-v2.test.js": "",
            "test/v2-part3-native-safe-fallback.test.js": "",
            "test/v2-part4-1-stable-auto-delivery.test.js": "",
            "test/v2-part4-2-auto-delivery-race.test.js": "",
            "test/v2-part4-3-strong-delivery-relay.test.js": "",
            "test/v2-part4-4-built-in-english.test.js": "",
            "test/v2-part4-5-malaysian-prompt.test.js": "",
            "test/v2-part4-fast-user-selected-auto.test.js": "",
            "wrangler.jsonc": ""
          }''')
          for relative, encoded in payloads.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify migration scope and preserved identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "id: 'community.smartsubs'" src/manifest.js
          grep -Fq "name: 'SmartSubs'" src/manifest.js
          grep -Fq '"name": "smartsubs"' wrangler.jsonc
          grep -Fq '"id": "4d1aa89065f44614bd7f5b7398f8b5b0"' wrangler.jsonc
          grep -Fq '"queue": "smartsubs-translation"' wrangler.jsonc
          grep -Fq '"namespace_id": "9282001"' wrangler.jsonc
          grep -Fq '"namespace_id": "9282002"' wrangler.jsonc
          grep -Fq '"name": "SMARTSUBS_DELIVERY"' wrangler.jsonc
          grep -Fq '"tag": "smartsubs-part4-3-delivery-relay"' wrangler.jsonc
          grep -Fq "natural, concise Malaysian Bahasa Melayu" src/translator.js
          grep -Fq "function buildEnglishTracks" src/subtitles.js
          grep -Fq "includeEnglishTracks: true" src/cloudflare-worker.mjs
          grep -Fq "queueProfile: 'user-selected-stable'" src/cloudflare-worker.mjs
          grep -Fq '"PLAYER_QUEUE_WAIT_MAX_MS": "9000"' wrangler.jsonc
          grep -Fq '"PLAYER_QUEUE_GRACE_MS": "600"' wrangler.jsonc

          if grep -R -n -E 'community\.smartsubsv2|smartsubsv2-translation|SmartSubsV2 Diagnose' src test wrangler.jsonc; then
            echo "SmartSubsV2 identity leaked into the SmartSubs runtime."
            exit 1
          fi

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -Ev '^(\.github/workflows/smartsubs\-smartsubsv2\-parity\-migration\.yml|README\.md|START_HERE\.md|docs/SMARTSUBSV2_PARITY_PORT\.md|package\-lock\.json|src/cloudflare\-worker\.mjs|src/configure\.js|src/diagnostics\.js|src/selector\.js|src/subtitles\.js|src/translator\.js|test/nuvio\-worker\.test\.js|test/smartsubs\-parity\-identity\.test\.js|test/v2\-baseline\-diagnose\-link\.test\.js|test/v2\-part1a\-english\-source\-diagnose\.test\.js|test/v2\-part1a2\-friendly\-diagnose\.test\.js|test/v2\-part2\-native\-malay\-ranking\.test\.js|test/v2\-part3\-1\-selected\-auto\-queue\-v2\.test\.js|test/v2\-part3\-native\-safe\-fallback\.test\.js|test/v2\-part4\-1\-stable\-auto\-delivery\.test\.js|test/v2\-part4\-2\-auto\-delivery\-race\.test\.js|test/v2\-part4\-3\-strong\-delivery\-relay\.test\.js|test/v2\-part4\-4\-built\-in\-english\.test\.js|test/v2\-part4\-5\-malaysian\-prompt\.test\.js|test/v2\-part4\-fast\-user\-selected\-auto\.test\.js|wrangler\.jsonc)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused parity tests
        run: node --test test/smartsubs-parity-identity.test.js test/v2-*.test.js test/nuvio-worker.test.js

      - name: Run syntax and full regression suite
        run: |
          npm run check
          npm test

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/smartsubs-parity-build

      - name: Commit verified SmartSubs parity migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/smartsubs-smartsubsv2-parity-migration.yml \
            README.md \
            START_HERE.md \
            docs/SMARTSUBSV2_PARITY_PORT.md \
            package-lock.json \
            src/cloudflare-worker.mjs \
            src/configure.js \
            src/diagnostics.js \
            src/selector.js \
            src/subtitles.js \
            src/translator.js \
            test/nuvio-worker.test.js \
            test/smartsubs-parity-identity.test.js \
            test/v2-baseline-diagnose-link.test.js \
            test/v2-part1a-english-source-diagnose.test.js \
            test/v2-part1a2-friendly-diagnose.test.js \
            test/v2-part2-native-malay-ranking.test.js \
            test/v2-part3-1-selected-auto-queue-v2.test.js \
            test/v2-part3-native-safe-fallback.test.js \
            test/v2-part4-1-stable-auto-delivery.test.js \
            test/v2-part4-2-auto-delivery-race.test.js \
            test/v2-part4-3-strong-delivery-relay.test.js \
            test/v2-part4-4-built-in-english.test.js \
            test/v2-part4-5-malaysian-prompt.test.js \
            test/v2-part4-fast-user-selected-auto.test.js \
            wrangler.jsonc

          if git diff --cached --quiet; then
            echo "SmartSubs parity migration is already applied."
            exit 0
          fi

          git commit -m "Port completed SmartSubsV2 improvements to SmartSubs"
          git push origin HEAD:main
