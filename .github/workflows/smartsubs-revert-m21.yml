name: Revert SmartSubs M21

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-m21:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Restore pre-M21 translator
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 --decode > src/translator.js
          echo '' | base64 --decode > test/m11.test.js

          python - <<'PY'
          from pathlib import Path
          p = Path("wrangler.jsonc")
          text = p.read_text()
          text = text.replace('"SMARTSUBS_CACHE_VERSION": "m21-v1"', '"SMARTSUBS_CACHE_VERSION": "m8-v1"')
          p.write_text(text)
          PY

      - name: Verify revert
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'for (const item of remaining) resolved.set(item.id, item.text)' src/translator.js
          grep -F '"SMARTSUBS_CACHE_VERSION": "m8-v1"' wrangler.jsonc

      - name: Syntax check
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Commit revert
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Nothing to revert."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/translator.js test/m11.test.js wrangler.jsonc
          git commit -m "Revert SmartSubs M21 translation integrity patch"
          git push origin HEAD:main
