          EXPECTED_SHA="f2f58b15a37e154e545385066ba3ca7234192ca5e474e5d118fc8e2f7c561762"
          ACTUAL_SHA="$(sha256sum /tmp/smartsubs-runtime.tar.gz | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: embedded runtime checksum mismatch"
            echo "expected=$EXPECTED_SHA"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

          # Remove all current runtime files while preserving Git metadata and workflows
          # until the dedicated workflow cleanup step below.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          tar -xzf /tmp/smartsubs-runtime.tar.gz -C .

      - name: Verify exact working identity
        shell: bash
        run: |
          set -euo pipefail

          test -f src/cloudflare-worker.mjs
          test -f src/diagnostics.js
          test -f src/translator.js
          test -f test/nuvio-worker.test.js
          test -f test/nuvio-diagnose.test.js
          test -f wrangler.jsonc
          test ! -f src/index.js
          test ! -f package-lock.json

          grep -q "final-stable-m20r3" src/cloudflare-worker.mjs
          grep -q "version: '1.0.0'" src/manifest.js
          grep -q "item.lang === 'msa'" src/cloudflare-worker.mjs
          grep -q '"SMARTSUBS_CACHE"' wrangler.jsonc
          grep -q '"SMARTSUBS_TRANSLATION_QUEUE"' wrangler.jsonc

          node - <<'NODE'
          const pkg = require('./package.json')
          if (pkg.version !== '1.0.0') throw new Error(`Expected 1.0.0, got ${pkg.version}`)
          NODE

          echo "Exact working build verified."

      - name: Install Wrangler for dry run
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run check > /tmp/check.log 2>&1; then
            echo "=== Syntax check failed ==="
            tail -n 80 /tmp/check.log
            exit 1
          fi
          tail -n 20 /tmp/check.log || true

      - name: Run exact 67-test suite
        shell: bash
        run: |
          set -euo pipefail
          if ! npm test > /tmp/test.log 2>&1; then
            echo "=== Tests failed ==="
            tail -n 120 /tmp/test.log
            exit 1
          fi
          grep -q "# pass 67" /tmp/test.log
          grep -q "# fail 0" /tmp/test.log
          tail -n 35 /tmp/test.log

      - name: Wrangler dry run
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --dry-run --outdir .cf-build > /tmp/wrangler.log 2>&1; then
            echo "=== Wrangler dry run failed ==="
            tail -n 100 /tmp/wrangler.log
            exit 1
          fi
          tail -n 30 /tmp/wrangler.log || true

      - name: Clean workflow files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .github/workflows
          mkdir -p .github/workflows

          echo '' | base64 --decode > .github/workflows/smartsubs-ci.yml

          echo "Remaining workflow files:"
          find .github/workflows -maxdepth 1 -type f -printf '%f\n'
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/smartsubs-ci.yml

      - name: Commit exact build and cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .cf-build node_modules
          rm -f package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "=== Changes to commit ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "ERROR: no changes were staged"
            exit 1
          fi

          git commit -m "restore: exact working SmartSubs and clean workflows [skip ci]"
          git push origin HEAD:main

          git fetch origin main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: origin/main does not match restore commit"
            exit 1
          fi

          echo "Restore and workflow cleanup pushed: $REMOTE"

      - name: Delete old workflow run history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_RUN="${{ github.run_id }}"
          REPO="${{ github.repository }}"

          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run_ids.txt

          while read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            if [ "$RUN_ID" = "$CURRENT_RUN" ]; then
              continue
            fi
            gh api --method DELETE "repos/$REPO/actions/runs/$RUN_ID" >/dev/null 2>&1 || true
          done < /tmp/run_ids.txt

          echo "Old workflow run cleanup attempted. Current restore run was preserved."
